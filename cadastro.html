<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Crie sua conta gratuitamente no Projeto Corre.">

    <meta
        name="theme-color"
        content="#A3FF12">

    <title>Projeto Corre | Criar conta</title>


    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --green: #A3FF12;
            --green-dark: #78c400;

            --black: #080808;
            --dark: #101010;
            --dark-2: #151515;
            --dark-3: #1d1d1d;

            --gray: #888;
            --white: #fff;

            --border: #292929;

        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family: "Poppins", sans-serif;

            background:

                radial-gradient(
                    circle at 80% 20%,
                    rgba(163,255,18,.10),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 10% 80%,
                    rgba(163,255,18,.05),
                    transparent 30%
                ),

                #080808;

            color: var(--white);

            overflow-x: hidden;

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        button,
        input {

            font-family: inherit;

        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            width: 100%;

            height: 78px;

            display: flex;

            align-items: center;

            border-bottom:
                1px solid rgba(255,255,255,.06);

            background:
                rgba(8,8,8,.90);

            backdrop-filter:
                blur(15px);

        }


        .header-content {

            width: min(1180px, 92%);

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 20px;

            font-weight: 700;

        }


        .logo i {

            color: var(--green);

            font-size: 25px;

        }


        .logo strong {

            color: var(--green);

        }


        .back-home {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #aaa;

            font-size: 13px;

            transition: .25s;

        }


        .back-home:hover {

            color: var(--green);

        }


        /* =====================================================
           ÁREA
        ===================================================== */

        .signup-area {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 60px 20px;

        }


        .signup-container {

            width: 100%;

            max-width: 470px;

        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .signup-header {

            text-align: center;

            margin-bottom: 30px;

        }


        .signup-icon {

            width: 62px;

            height: 62px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            background:
                rgba(163,255,18,.08);

            border:
                1px solid rgba(163,255,18,.20);

            color: var(--green);

            font-size: 26px;

        }


        .signup-header h1 {

            font-size: 34px;

            line-height: 1.15;

            letter-spacing: -1px;

            margin-bottom: 10px;

        }


        .signup-header h1 span {

            color: var(--green);

        }


        .signup-header p {

            color: #777;

            font-size: 13px;

            line-height: 1.7;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .signup-card {

            padding: 35px;

            background:

                linear-gradient(
                    145deg,
                    rgba(23,23,23,.98),
                    rgba(13,13,13,.98)
                );

            border:
                1px solid #292929;

            border-radius: 24px;

            box-shadow:
                0 30px 80px rgba(0,0,0,.40);

        }


        /* =====================================================
           MENSAGEM
        ===================================================== */

        .message {

            display: none;

            padding: 12px 14px;

            margin-bottom: 18px;

            border-radius: 10px;

            font-size: 12px;

            line-height: 1.6;

        }


        .message.error {

            display: block;

            background:
                rgba(255,60,60,.08);

            border:
                1px solid rgba(255,60,60,.25);

            color: #ff8585;

        }


        .message.success {

            display: block;

            background:
                rgba(163,255,18,.08);

            border:
                1px solid rgba(163,255,18,.25);

            color: var(--green);

        }


        .message.warning {

            display: block;

            background:
                rgba(255,180,0,.08);

            border:
                1px solid rgba(255,180,0,.20);

            color: #ffc44d;

        }


        /* =====================================================
           CAMPOS
        ===================================================== */

        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #ddd;

            font-size: 12px;

            font-weight: 500;

        }


        .input-wrapper {

            position: relative;

        }


        .input-wrapper > i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #666;

            font-size: 14px;

            pointer-events: none;

            z-index: 2;

        }


        .input-wrapper input {

            width: 100%;

            height: 50px;

            padding:
                0 15px 0 43px;

            background: #0c0c0c;

            border:
                1px solid #292929;

            border-radius: 11px;

            outline: none;

            color: #fff;

            font-size: 13px;

            transition: .25s;

        }


        .input-wrapper input::placeholder {

            color: #555;

        }


        .input-wrapper input:focus {

            border-color:
                var(--green);

            box-shadow:
                0 0 0 3px
                rgba(163,255,18,.06);

        }


        .input-wrapper input.invalid {

            border-color:
                #ff5555;

        }


        /* =====================================================
           SENHA
        ===================================================== */

        .password-toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #666;

            cursor: pointer;

            padding: 5px;

            z-index: 3;

        }


        .password-toggle:hover {

            color: var(--green);

        }


        /* =====================================================
           TERMOS
        ===================================================== */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin: 22px 0;

        }


        .terms input {

            width: 16px;

            height: 16px;

            margin-top: 2px;

            accent-color:
                var(--green);

            cursor: pointer;

            flex-shrink: 0;

        }


        .terms label {

            color: #777;

            font-size: 11px;

            line-height: 1.6;

            cursor: pointer;

        }


        .terms a {

            color: var(--green);

            font-weight: 600;

        }


        .terms a:hover {

            text-decoration: underline;

        }


        /* =====================================================
           BOTÃO
        ===================================================== */

        .btn-submit {

            width: 100%;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            border: none;

            border-radius: 12px;

            background:
                var(--green);

            color: #080808;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: .25s;

        }


        .btn-submit:hover:not(:disabled) {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 35px
                rgba(163,255,18,.18);

        }


        .btn-submit:active {

            transform:
                translateY(0);

        }


        .btn-submit:disabled {

            opacity: .45;

            cursor:
                not-allowed;

            transform: none;

            box-shadow: none;

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        .login-link {

            text-align: center;

            margin-top: 24px;

            color: #666;

            font-size: 12px;

        }


        .login-link a {

            color:
                var(--green);

            font-weight: 600;

        }


        .login-link a:hover {

            text-decoration:
                underline;

        }


        /* =====================================================
           BENEFÍCIOS
        ===================================================== */

        .mini-benefits {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 25px;

        }


        .mini-benefit {

            padding: 13px 8px;

            text-align: center;

            border:
                1px solid #202020;

            border-radius: 12px;

            background:
                rgba(255,255,255,.015);

        }


        .mini-benefit i {

            display: block;

            color:
                var(--green);

            font-size: 15px;

            margin-bottom: 6px;

        }


        .mini-benefit span {

            color: #666;

            font-size: 9px;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            padding: 22px;

            text-align: center;

            border-top:
                1px solid #181818;

            color: #444;

            font-size: 10px;

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 600px) {

            header {

                height: 70px;

            }


            .signup-area {

                padding:
                    40px 15px;

            }


            .signup-card {

                padding:
                    25px 20px;

                border-radius:
                    20px;

            }


            .signup-header h1 {

                font-size: 29px;

            }


            .signup-header p {

                font-size: 12px;

            }


            .mini-benefits {

                grid-template-columns:
                    1fr;

            }


            .mini-benefit {

                display: flex;

                align-items: center;

                justify-content: center;

                gap: 8px;

            }


            .mini-benefit i {

                margin: 0;

            }


            .back-home span {

                display: none;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <div class="header-content">


            <a
                href="index.html"
                class="logo">

                <i
                    class="fa-solid fa-person-running">
                </i>

                <span>

                    Projeto
                    <strong>Corre</strong>

                </span>

            </a>


            <a
                href="index.html"
                class="back-home">

                <i
                    class="fa-solid fa-arrow-left">
                </i>

                <span>
                    Voltar para o início
                </span>

            </a>


        </div>

    </header>


    <!-- =====================================================
         CADASTRO
    ===================================================== -->

    <main class="signup-area">


        <div class="signup-container">


            <div class="signup-header">


                <div class="signup-icon">

                    <i
                        class="fa-solid fa-person-running">
                    </i>

                </div>


                <h1>

                    Comece sua
                    <span>jornada.</span>

                </h1>


                <p>

                    Crie sua conta gratuitamente
                    e dê o primeiro passo com o
                    Projeto Corre.

                </p>


            </div>


            <div class="signup-card">


                <!-- MENSAGEM -->

                <div
                    id="message"
                    class="message">
                </div>


                <!-- FORM -->

                <form
                    id="signupForm"
                    novalidate>


                    <!-- NOME -->

                    <div class="form-group">

                        <label for="name">

                            Nome completo

                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fa-solid fa-user">
                            </i>


                            <input
                                type="text"
                                id="name"
                                placeholder="Como podemos te chamar?"
                                autocomplete="name"
                                minlength="3"
                                required>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">

                            E-mail

                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fa-solid fa-envelope">
                            </i>


                            <input
                                type="email"
                                id="email"
                                placeholder="seu@email.com"
                                autocomplete="email"
                                required>

                        </div>

                    </div>


                    <!-- SENHA -->

                    <div class="form-group">

                        <label for="password">

                            Senha

                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fa-solid fa-lock">
                            </i>


                            <input
                                type="password"
                                id="password"
                                placeholder="Crie uma senha"
                                autocomplete="new-password"
                                minlength="6"
                                required>


                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Mostrar senha">

                                <i
                                    class="fa-solid fa-eye">
                                </i>

                            </button>


                        </div>

                    </div>


                    <!-- CONFIRMAR SENHA -->

                    <div class="form-group">

                        <label for="confirmPassword">

                            Confirmar senha

                        </label>


                        <div class="input-wrapper">

                            <i
                                class="fa-solid fa-lock">
                            </i>


                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Digite a senha novamente"
                                autocomplete="new-password"
                                minlength="6"
                                required>

                        </div>

                    </div>


                    <!-- TERMOS -->

                    <div class="terms">


                        <input
                            type="checkbox"
                            id="aceiteTermos"
                            required>


                        <label
                            for="aceiteTermos">

                            Li e concordo com os

                            <a
                                href="termos-de-uso.html"
                                target="_blank"
                                rel="noopener noreferrer">

                                Termos de Uso

                            </a>

                            e estou ciente das condições apresentadas.

                        </label>


                    </div>


                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn-submit"
                        id="btnSubmit"
                        disabled>


                        <span id="btnText">

                            Criar minha conta

                        </span>


                        <i
                            class="fa-solid fa-arrow-right"
                            id="btnIcon">
                        </i>


                    </button>


                </form>


                <!-- LOGIN -->

                <div class="login-link">

                    Já possui uma conta?


                    <a href="login.html">

                        Entrar

                    </a>

                </div>


            </div>


            <!-- BENEFÍCIOS -->

            <div class="mini-benefits">


                <div class="mini-benefit">

                    <i
                        class="fa-solid fa-check">
                    </i>

                    <span>
                        Cadastro gratuito
                    </span>

                </div>


                <div class="mini-benefit">

                    <i
                        class="fa-solid fa-shield-halved">
                    </i>

                    <span>
                        Seus dados protegidos
                    </span>

                </div>


                <div class="mini-benefit">

                    <i
                        class="fa-solid fa-bolt">
                    </i>

                    <span>
                        Comece agora
                    </span>

                </div>


            </div>


        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer>

        © 2026 Projeto Corre.
        Feito para quem decidiu começar.

    </footer>


</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://mubzyyppizxuofitnysp.supabase.co";


        const SUPABASE_ANON_KEY =
            "sb_publishable_7TMsNk3z-oks9HQjTfi6ug_dy0Rvaw0";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const form =
            document.getElementById(
                "signupForm"
            );


        const nameInput =
            document.getElementById(
                "name"
            );


        const emailInput =
            document.getElementById(
                "email"
            );


        const passwordInput =
            document.getElementById(
                "password"
            );


        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        const terms =
            document.getElementById(
                "aceiteTermos"
            );


        const button =
            document.getElementById(
                "btnSubmit"
            );


        const buttonText =
            document.getElementById(
                "btnText"
            );


        const buttonIcon =
            document.getElementById(
                "btnIcon"
            );


        const message =
            document.getElementById(
                "message"
            );


        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        /* =====================================================
           MENSAGENS
        ===================================================== */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        function clearMessage() {

            message.textContent =
                "";

            message.className =
                "message";

        }


        /* =====================================================
           BOTÃO
        ===================================================== */

        function setLoading(
            loading
        ) {

            if (loading) {

                button.disabled =
                    true;

                buttonText.textContent =
                    "Criando conta...";

                buttonIcon.className =
                    "fa-solid fa-spinner fa-spin";

            } else {

                button.disabled =
                    !terms.checked;

                buttonText.textContent =
                    "Criar minha conta";

                buttonIcon.className =
                    "fa-solid fa-arrow-right";

            }

        }


        /* =====================================================
           MOSTRAR / OCULTAR SENHA
        ===================================================== */

        togglePassword.addEventListener(
            "click",
            function () {


                const isPassword =
                    passwordInput.type ===
                    "password";


                passwordInput.type =
                    isPassword
                        ? "text"
                        : "password";


                this.innerHTML =
                    isPassword

                        ? '<i class="fa-solid fa-eye-slash"></i>'

                        : '<i class="fa-solid fa-eye"></i>';


                this.setAttribute(
                    "aria-label",
                    isPassword
                        ? "Ocultar senha"
                        : "Mostrar senha"
                );

            }
        );


        /* =====================================================
           TERMOS
        ===================================================== */

        terms.addEventListener(
            "change",
            function () {

                button.disabled =
                    !this.checked;

            }
        );


        /* =====================================================
           VALIDAÇÃO DE E-MAIL
        ===================================================== */

        function emailValido(
            email
        ) {

            /*
             * Validação simples e ampla.
             *
             * Não limita a Gmail,
             * Hotmail, Outlook etc.
             */

            const regex =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            return regex.test(
                email
            );

        }


        /* =====================================================
           CADASTRO
        ===================================================== */

        form.addEventListener(
            "submit",
            async function (event) {


                event.preventDefault();

                clearMessage();


                /* =================================================
                   NOME
                ================================================= */

                const nome =
                    nameInput.value
                        .trim();


                if (nome.length < 3) {

                    showMessage(
                        "Digite seu nome completo.",
                        "error"
                    );

                    nameInput.focus();

                    return;

                }


                /* =================================================
                   E-MAIL
                ================================================= */

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                /*
                 * Aceita qualquer domínio de e-mail
                 * que esteja em formato válido.
                 */

                if (
                    !email ||
                    !emailValido(email)
                ) {

                    emailInput.classList.add(
                        "invalid"
                    );


                    showMessage(
                        "Digite um endereço de e-mail válido, por exemplo: seuemail@dominio.com",
                        "error"
                    );


                    emailInput.focus();

                    return;

                }


                emailInput.classList.remove(
                    "invalid"
                );


                /* =================================================
                   SENHA
                ================================================= */

                const senha =
                    passwordInput.value;


                if (senha.length < 6) {

                    showMessage(
                        "A senha precisa ter pelo menos 6 caracteres.",
                        "error"
                    );

                    passwordInput.focus();

                    return;

                }


                /* =================================================
                   CONFIRMAÇÃO
                ================================================= */

                const confirmacao =
                    confirmPasswordInput.value;


                if (
                    senha !==
                    confirmacao
                ) {

                    showMessage(
                        "As senhas não são iguais.",
                        "error"
                    );

                    confirmPasswordInput.focus();

                    return;

                }


                /* =================================================
                   TERMOS
                ================================================= */

                if (!terms.checked) {

                    showMessage(
                        "Você precisa aceitar os Termos de Uso para continuar.",
                        "error"
                    );

                    return;

                }


                /* =================================================
                   CARREGANDO
                ================================================= */

                setLoading(true);


                try {


                    /* =================================================
                       CADASTRO NO SUPABASE AUTH
                    ================================================= */

                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth.signUp({

                            email: email,

                            password: senha,

                            options: {

                                /*
                                 * Dados adicionais do usuário.
                                 *
                                 * O nome fica armazenado
                                 * nos metadados do Supabase.
                                 */

                                data: {

                                    name: nome,

                                    full_name: nome,

                                    plan: "free"

                                },


                                /*
                                 * Depois da confirmação,
                                 * o Supabase retorna para
                                 * o endereço da aplicação.
                                 */

                                emailRedirectTo:
                                    window.location.origin +
                                    "/login.html"

                            }

                        });


                    /* =================================================
                       ERRO
                    ================================================= */

                    if (error) {

                        console.error(
                            "Erro Supabase:",
                            error
                        );


                        const erro =
                            error.message
                                .toLowerCase();


                        /* E-MAIL JÁ EXISTENTE */

                        if (
                            erro.includes(
                                "already registered"
                            ) ||
                            erro.includes(
                                "already exists"
                            )
                        ) {

                            showMessage(
                                "Este e-mail já possui uma conta. Entre pela página de login.",
                                "error"
                            );

                            setLoading(false);

                            return;

                        }


                        /* E-MAIL INVÁLIDO */

                        if (
                            erro.includes(
                                "invalid email"
                            )
                        ) {

                            showMessage(
                                "O Supabase considerou esse endereço de e-mail inválido. Verifique se o endereço foi digitado corretamente.",
                                "error"
                            );

                            setLoading(false);

                            return;

                        }


                        /* SENHA */

                        if (
                            erro.includes(
                                "password"
                            )
                        ) {

                            showMessage(
                                error.message,
                                "error"
                            );

                            setLoading(false);

                            return;

                        }


                        /* ERRO GENÉRICO */

                        showMessage(
                            "Não foi possível criar sua conta: " +
                            error.message,
                            "error"
                        );

                        setLoading(false);

                        return;

                    }


                    /* =================================================
                       USUÁRIO NÃO RETORNOU
                    ================================================= */

                    if (
                        !data ||
                        !data.user
                    ) {

                        showMessage(
                            "A conta não pôde ser criada. Tente novamente.",
                            "error"
                        );

                        setLoading(false);

                        return;

                    }


                    const user =
                        data.user;


                    /* =================================================
                       CONTA CRIADA
                    ================================================= */

                    /*
                     * Quando a confirmação de e-mail está
                     * ativada, o Supabase normalmente não
                     * cria uma sessão imediatamente.
                     */

                    if (
                        !data.session
                    ) {


                        button.disabled =
                            true;


                        buttonText.textContent =
                            "Conta criada!";


                        buttonIcon.className =
                            "fa-solid fa-check";


                        showMessage(
                            "Conta criada com sucesso! Enviamos um link de confirmação para " +
                            email +
                            ". Confirme seu e-mail para depois entrar no Projeto Corre.",
                            "success"
                        );


                        /*
                         * Não redireciona automaticamente.
                         *
                         * Assim o usuário consegue ler
                         * a mensagem e abrir o e-mail.
                         */

                        return;

                    }


                    /* =================================================
                       CASO A CONFIRMAÇÃO ESTEJA DESATIVADA
                    ================================================= */

                    localStorage.setItem(
                        "userName",
                        nome
                    );


                    localStorage.setItem(
                        "userEmail",
                        email
                    );


                    localStorage.setItem(
                        "projetoCorreLogado",
                        "true"
                    );


                    localStorage.setItem(
                        "correSession",
                        "1"
                    );


                    localStorage.setItem(
                        "correUser",
                        JSON.stringify({

                            id: user.id,

                            name: nome,

                            email: email,

                            plan: "free"

                        })
                    );


                    buttonText.textContent =
                        "Conta criada!";


                    buttonIcon.className =
                        "fa-solid fa-check";


                    showMessage(
                        "Conta criada com sucesso! Redirecionando...",
                        "success"
                    );


                    setTimeout(
                        function () {

                            window.location.href =
                                "painel.html";

                        },
                        800
                    );


                } catch (error) {


                    console.error(
                        "Erro inesperado:",
                        error
                    );


                    showMessage(
                        "Ocorreu um erro inesperado. Verifique sua conexão e tente novamente.",
                        "error"
                    );


                    setLoading(false);

                }

            }
        );


        /* =====================================================
           LIMPAR ERRO DO E-MAIL
        ===================================================== */

        emailInput.addEventListener(
            "input",
            function () {

                this.classList.remove(
                    "invalid"
                );

                if (
                    message.classList.contains(
                        "error"
                    )
                ) {

                    clearMessage();

                }

            }
        );


    }

);

</script>


</body>

</html>
