<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Projeto Corre</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>

body{

margin:0;
font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#071000,#0f1f00,#111);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}

.login-box{

width:380px;
max-width:92%;
background:#151515;
padding:45px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.45);

}

.logo{

text-align:center;
margin-bottom:35px;

}

.logo h1{

color:white;
font-size:34px;

}

.logo span{

color:#A3FF12;

}

input{

width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:12px;
background:#242424;
color:white;
font-size:16px;

}

input:focus{

outline:2px solid #A3FF12;

}

button{

width:100%;
padding:17px;
margin-top:25px;
border:none;
border-radius:14px;
background:#A3FF12;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.3s;

}

button:hover{

transform:translateY(-3px);

}

.links{

display:flex;
justify-content:space-between;
margin-top:20px;

}

.links a{

color:#A3FF12;
text-decoration:none;
font-size:14px;

}

.google{

margin-top:18px;
background:#fff;
color:#111;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

<h1>Projeto <span>Corre</span></h1>

<p style="color:#bbb">
Bem-vindo de volta.
</p>

</div>

<form id="loginForm">

<input
type="email"
placeholder="Seu e-mail"
required>

<input
type="password"
placeholder="Sua senha"
required>

<button type="submit">

Entrar

</button>

<button
type="button"
class="google">

Entrar com Google

</button>

<div class="links">

<a href="#">Esqueci minha senha</a>

<a href="cadastro.html">Criar conta</a>

</div>

</form>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit",function(e){

e.preventDefault();

window.location.href="dashboard.html";

});

</script>

</body>

</html>
