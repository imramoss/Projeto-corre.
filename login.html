<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Entre na sua conta do Projeto Corre.">

    <meta
        name="theme-color"
        content="#A3FF12">

    <title>Entrar | Projeto Corre</title>


    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --green: #A3FF12;
            --black: #080808;
            --dark: #101010;
            --dark-2: #151515;

            --white: #fff;

            --gray: #777;
            --gray-light: #aaa;

            --border: #292929;

        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family: "Poppins", sans-serif;

            color: var(--white);

            background:

                radial-gradient(
                    circle at top right,
                    rgba(163,255,18,.12),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom left,
                    rgba(163,255,18,.05),
                    transparent 30%
                ),

                var(--black);

            overflow-x: hidden;

        }


        .login-box {

            width: 100%;

            max-width: 430px;

            padding: 40px;

            background:

                linear-gradient(
                    145deg,
                    rgba(23,23,23,.98),
                    rgba(13,13,13,.98)
                );

            border: 1px solid var(--border);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.5);

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            text-align: center;

            margin-bottom: 35px;

        }


        .logo i {

            display: block;

            color: var(--green);

            font-size: 35px;

            margin-bottom: 10px;

        }


        .logo h1 {

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -1px;

        }


        .logo span {

            color: var(--green);

        }


        .logo p {

            color: var(--gray);

            margin-top: 8px;

            font-size: 13px;

            line-height: 1.6;

        }


        /* =====================================================
           CAMPOS
        ===================================================== */

        .form-group {

            margin-top: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            color: var(--gray-light);

        }


        .input-wrapper {

            position: relative;

        }


        .input-wrapper > i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #666;

            pointer-events: none;

            z-index: 2;

        }


        input {

            width: 100%;

            height: 52px;

            padding: 0 15px 0 43px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background: #0f0f0f;

            color: white;

            font-family: inherit;

            font-size: 13px;

            outline: none;

            transition: .25s;

        }


        input::placeholder {

            color: #555;

        }


        input:focus {

            border-color: var(--green);

            box-shadow:
                0 0 0 3px rgba(163,255,18,.06);

        }


        /* =====================================================
           SENHA
        ===================================================== */

        .password-wrapper input {

            padding-right: 50px;

        }


        .toggle-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #666;

            cursor: pointer;

            padding: 6px;

            font-size: 14px;

            z-index: 3;

        }


        .toggle-password:hover {

            color: var(--green);

        }


        /* =====================================================
           BOTÕES
        ===================================================== */

        .btn {

            width: 100%;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            margin-top: 25px;

            border: 0;

            border-radius: 13px;

            background: var(--green);

            color: var(--black);

            font-family: inherit;

            font-weight: 800;

            font-size: 14px;

            cursor: pointer;

            transition: .25s;

        }


        .btn:hover:not(:disabled) {

            transform: translateY(-2px);

            box-shadow:
                0 15px 35px rgba(163,255,18,.18);

        }


        .btn:active {

            transform: translateY(0);

        }


        .btn:disabled {

            opacity: .5;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

        }


        .google {

            background: white;

            color: #111;

            margin-top: 12px;

        }


        .google:hover:not(:disabled) {

            box-shadow:
                0 15px 35px rgba(255,255,255,.08);

        }


        /* =====================================================
           MENSAGEM
        ===================================================== */

        .message {

            display: none;

            margin-top: 15px;

            padding: 13px 15px;

            border-radius: 10px;

            font-size: 12px;

            line-height: 1.6;

        }


        .message.error {

            display: block;

            background:
                rgba(255,50,50,.10);

            border:
                1px solid rgba(255,80,80,.20);

            color: #ff7777;

        }


        .message.success {

            display: block;

            background:
                rgba(163,255,18,.08);

            border:
                1px solid rgba(163,255,18,.25);

            color: var(--green);

        }


        .message.warning {

            display: block;

            background:
                rgba(255,180,0,.08);

            border:
                1px solid rgba(255,180,0,.20);

            color: #ffc44d;

        }


        .message.info {

            display: block;

            background:
                rgba(80,160,255,.08);

            border:
                1px solid rgba(80,160,255,.20);

            color: #75b8ff;

        }


        /* =====================================================
           LINKS
        ===================================================== */

        .links {

            margin-top: 22px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            font-size: 12px;

        }


        .links a {

            color: var(--green);

            text-decoration: none;

            transition: .2s;

        }


        .links a:hover {

            text-decoration: underline;

        }


        .forgot-password {

            color: #777 !important;

        }


        .forgot-password:hover {

            color: var(--green) !important;

        }


        /* =====================================================
           VOLTAR
        ===================================================== */

        .back {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 28px;

            color: #777;

            font-size: 12px;

            text-decoration: none;

            transition: .2s;

        }


        .back:hover {

            color: var(--green);

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 500px) {

            body {

                padding: 15px;

            }


            .login-box {

                padding: 30px 22px;

                border-radius: 20px;

            }


            .logo {

                margin-bottom: 28px;

            }


            .logo h1 {

                font-size: 27px;

            }


            .links {

                flex-direction: column;

                justify-content: center;

                text-align: center;

            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo">

        <i class="fa-solid fa-person-running"></i>

        <h1>
            Projeto <span>Corre</span>
        </h1>

        <p>
            Entre para continuar sua jornada.
        </p>

    </div>


    <!-- =====================================================
         FORMULÁRIO
    ====================================================== -->

    <form id="loginForm">


        <!-- E-MAIL -->

        <div class="form-group">

            <label for="email">
                E-mail
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required>

            </div>

        </div>


        <!-- SENHA -->

        <div class="form-group">

            <label for="senha">
                Senha
            </label>

            <div class="input-wrapper password-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="senha"
                    name="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required>

                <button
                    type="button"
                    class="toggle-password"
                    id="toggleLoginPassword"
                    aria-label="Mostrar senha">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>


        <!-- BOTÃO ENTRAR -->

        <button
            class="btn"
            id="loginButton"
            type="submit">

            <span id="loginButtonText">
                Entrar
            </span>

            <i
                class="fa-solid fa-arrow-right"
                id="loginButtonIcon">
            </i>

        </button>


        <!-- GOOGLE -->

        <button
            class="btn google"
            id="googleLoginButton"
            type="button">

            <i class="fa-brands fa-google"></i>

            <span>
                Entrar com Google
            </span>

        </button>


        <!-- MENSAGEM -->

        <div
            class="message"
            id="message"
            role="alert"
            aria-live="polite">
        </div>


        <!-- LINKS -->

        <div class="links">

            <a
                href="#"
                class="forgot-password"
                id="forgotPassword">

                Esqueci minha senha

            </a>


            <a href="cadastro.html">

                Criar conta

            </a>

        </div>


    </form>


    <!-- VOLTAR -->

    <a
        href="index.html"
        class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Voltar para o início

    </a>


</div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =====================================================
       CONFIGURAÇÃO SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        "https://mubzyyppizxuofitnysp.supabase.co";


    const SUPABASE_ANON_KEY =
        "sb_publishable_7TMsNk3z-oks9HQjTfi6ug_dy0Rvaw0";


    const {
        createClient
    } = window.supabase;


    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const loginForm =
        document.getElementById("loginForm");


    const emailInput =
        document.getElementById("email");


    const passwordInput =
        document.getElementById("senha");


    const loginButton =
        document.getElementById("loginButton");


    const loginButtonText =
        document.getElementById("loginButtonText");


    const loginButtonIcon =
        document.getElementById("loginButtonIcon");


    const googleLoginButton =
        document.getElementById("googleLoginButton");


    const message =
        document.getElementById("message");


    const forgotPassword =
        document.getElementById("forgotPassword");


    const togglePassword =
        document.getElementById("toggleLoginPassword");


    /* =====================================================
       MENSAGEM
    ===================================================== */

    function showMessage(text, type = "error") {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    function clearMessage() {

        message.textContent = "";

        message.className = "message";

    }


    /* =====================================================
       BOTÃO
    ===================================================== */

    function setLoading(loading) {

        if (loading) {

            loginButton.disabled = true;

            googleLoginButton.disabled = true;

            loginButtonText.textContent =
                "Entrando...";

            loginButtonIcon.className =
                "fa-solid fa-spinner fa-spin";

        } else {

            loginButton.disabled = false;

            googleLoginButton.disabled = false;

            loginButtonText.textContent =
                "Entrar";

            loginButtonIcon.className =
                "fa-solid fa-arrow-right";

        }

    }


    /* =====================================================
       MOSTRAR / OCULTAR SENHA
    ===================================================== */

    togglePassword.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type === "password";


            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";


            this.innerHTML =
                isPassword
                    ? '<i class="fa-solid fa-eye-slash"></i>'
                    : '<i class="fa-solid fa-eye"></i>';


            this.setAttribute(
                "aria-label",
                isPassword
                    ? "Ocultar senha"
                    : "Mostrar senha"
            );

        }
    );


    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            clearMessage();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            if (!email) {

                showMessage(
                    "Digite seu e-mail.",
                    "error"
                );

                emailInput.focus();

                return;

            }


            if (!password) {

                showMessage(
                    "Digite sua senha.",
                    "error"
                );

                passwordInput.focus();

                return;

            }


            setLoading(true);


            try {

                /*
                 * LOGIN REAL NO SUPABASE
                 */

                const {
                    data,
                    error
                } = await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


                if (error) {

                    console.error(
                        "Erro Supabase:",
                        error
                    );


                    /*
                     * E-MAIL AINDA NÃO CONFIRMADO
                     */

                    if (
                        error.message
                            .toLowerCase()
                            .includes("email not confirmed")
                    ) {

                        showMessage(
                            "Seu e-mail ainda não foi confirmado. Abra o e-mail enviado pelo Projeto Corre e confirme sua conta antes de entrar.",
                            "warning"
                        );

                        setLoading(false);

                        return;

                    }


                    /*
                     * LOGIN INCORRETO
                     */

                    if (
                        error.message
                            .toLowerCase()
                            .includes("invalid login credentials")
                    ) {

                        showMessage(
                            "E-mail ou senha incorretos.",
                            "error"
                        );

                        setLoading(false);

                        return;

                    }


                    showMessage(
                        "Não foi possível entrar: " +
                        error.message,
                        "error"
                    );

                    setLoading(false);

                    return;

                }


                if (!data || !data.user) {

                    showMessage(
                        "Não foi possível identificar sua conta.",
                        "error"
                    );

                    setLoading(false);

                    return;

                }


                /* =================================================
                   USUÁRIO AUTENTICADO
                ================================================= */

                const user =
                    data.user;


                /*
                 * Salva compatibilidade com páginas antigas
                 */

                localStorage.setItem(
                    "userEmail",
                    user.email || email
                );


                localStorage.setItem(
                    "userName",
                    user.user_metadata?.name ||
                    user.user_metadata?.full_name ||
                    user.email?.split("@")[0] ||
                    "Corredor"
                );


                localStorage.setItem(
                    "projetoCorreLogado",
                    "true"
                );


                localStorage.setItem(
                    "correSession",
                    "1"
                );


                localStorage.setItem(
                    "correUser",
                    JSON.stringify({

                        id: user.id,

                        email: user.email,

                        name:
                            user.user_metadata?.name ||
                            user.user_metadata?.full_name ||
                            user.email?.split("@")[0]

                    })
                );


                /* =================================================
                   SUCESSO
                ================================================= */

                loginButtonText.textContent =
                    "Login realizado!";


                loginButtonIcon.className =
                    "fa-solid fa-check";


                showMessage(
                    "Login realizado com sucesso! Redirecionando...",
                    "success"
                );


                /*
                 * Pequeno intervalo para mostrar
                 * a mensagem de sucesso.
                 */

                setTimeout(function () {

                    window.location.href =
                        "painel.html";

                }, 700);


            } catch (error) {

                console.error(
                    "Erro inesperado:",
                    error
                );


                showMessage(
                    "Ocorreu um erro inesperado ao tentar entrar.",
                    "error"
                );


                setLoading(false);

            }

        }
    );


    /* =====================================================
       ESQUECI MINHA SENHA
    ===================================================== */

    forgotPassword.addEventListener(
        "click",
        async function (event) {

            event.preventDefault();

            clearMessage();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            if (!email) {

                showMessage(
                    "Digite seu e-mail primeiro para receber o link de recuperação.",
                    "warning"
                );

                emailInput.focus();

                return;

            }


            forgotPassword.style.pointerEvents =
                "none";


            forgotPassword.textContent =
                "Enviando...";


            try {

                const {
                    error
                } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            email,
                            {

                                redirectTo:
                                    window.location.origin +
                                    "/redefinir-senha.html"

                            }
                        );


                if (error) {

                    console.error(
                        "Erro recuperação:",
                        error
                    );


                    showMessage(
                        "Não foi possível enviar o e-mail de recuperação: " +
                        error.message,
                        "error"
                    );

                } else {

                    showMessage(
                        "Se este e-mail estiver cadastrado, você receberá um link para redefinir sua senha.",
                        "success"
                    );

                }

            } catch (error) {

                console.error(error);


                showMessage(
                    "Não foi possível solicitar a recuperação da senha.",
                    "error"
                );

            }


            forgotPassword.style.pointerEvents =
                "auto";


            forgotPassword.textContent =
                "Esqueci minha senha";

        }
    );


    /* =====================================================
       LOGIN COM GOOGLE
    ===================================================== */

    googleLoginButton.addEventListener(
        "click",
        async function () {

            clearMessage();

            googleLoginButton.disabled =
                true;


            try {

                const {
                    error
                } =
                    await supabaseClient.auth
                        .signInWithOAuth({

                            provider: "google",

                            options: {

                                redirectTo:
                                    window.location.origin +
                                    "/painel.html"

                            }

                        });


                if (error) {

                    console.error(
                        "Erro Google:",
                        error
                    );


                    showMessage(
                        "Não foi possível entrar com o Google: " +
                        error.message,
                        "error"
                    );


                    googleLoginButton.disabled =
                        false;

                }

            } catch (error) {

                console.error(error);


                showMessage(
                    "Erro ao conectar com o Google.",
                    "error"
                );


                googleLoginButton.disabled =
                    false;

            }

        }
    );


    /* =====================================================
       VERIFICAR SESSÃO EXISTENTE
    ===================================================== */

    async function verificarSessao() {

        try {

            const {
                data
            } =
                await supabaseClient.auth
                    .getSession();


            if (
                data &&
                data.session &&
                data.session.user
            ) {

                console.log(
                    "Usuário já está autenticado."
                );

            }

        } catch (error) {

            console.error(
                "Erro ao verificar sessão:",
                error
            );

        }

    }


    verificarSessao();


});

</script>


</body>

</html>
