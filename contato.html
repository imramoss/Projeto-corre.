<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Projeto Corre</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            font-family: Poppins, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(163,255,18,.12),
                    transparent 35%
                ),
                #080808;

            color: white;

        }

        .box {

            width: 100%;

            max-width: 470px;

            padding: 40px;

            background: #151515;

            border: 1px solid #292929;

            border-radius: 25px;

        }

        .logo {

            text-align: center;

            margin-bottom: 30px;

        }

        .logo h1 {

            font-size: 30px;

        }

        .logo span {

            color: #A3FF12;

        }

        .logo p {

            color: #777;

            font-size: 13px;

            margin-top: 8px;

        }

        label {

            display: block;

            color: #aaa;

            font-size: 12px;

            margin:

                15px 0 7px;

        }

        input,
        select {

            width: 100%;

            padding: 14px;

            border-radius: 11px;

            border: 1px solid #292929;

            background: #0e0e0e;

            color: white;

            font-family: inherit;

        }

        button {

            width: 100%;

            padding: 16px;

            margin-top: 25px;

            border: none;

            border-radius: 12px;

            background: #A3FF12;

            font-weight: 800;

            cursor: pointer;

        }

        .login {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #A3FF12;

            font-size: 13px;

            text-decoration: none;

        }

    </style>

</head>

<body>


<div class="box">


    <div class="logo">

        <h1>
            Projeto <span>Corre</span>
        </h1>

        <p>
            Comece hoje sua jornada.
        </p>

    </div>


    <form id="cadastro">


        <label>
            Seu nome
        </label>

        <input
            id="nome"
            type="text"
            placeholder="Como podemos te chamar?"
            required>


        <label>
            E-mail
        </label>

        <input
            id="email"
            type="email"
            placeholder="seu@email.com"
            required>


        <label>
            Senha
        </label>

        <input
            id="senha"
            type="password"
            placeholder="Crie uma senha"
            minlength="6"
            required>


        <label>
            Seu nível atual
        </label>

        <select id="nivel">

            <option value="iniciante">
                Estou começando
            </option>

            <option value="intermediario">
                Já corro às vezes
            </option>

            <option value="avancado">
                Já tenho experiência
            </option>

        </select>


        <button type="submit">

            Criar minha conta

        </button>


    </form>


    <a
        href="login.html"
        class="login">

        Já tenho uma conta

    </a>


</div>


<script>

document
    .getElementById("cadastro")
    .addEventListener(
        "submit",
        function(e) {

            e.preventDefault();


            const user = {

                name:
                    document.getElementById(
                        "nome"
                    ).value,

                email:
                    document.getElementById(
                        "email"
                    ).value,

                nivel:
                    document.getElementById(
                        "nivel"
                    ).value

            };


            localStorage.setItem(
                "correUser",
                JSON.stringify(user)
            );


            localStorage.setItem(
                "correSession",
                "1"
            );


            window.location.href =
                "dashboard.html";

        }
    );

</script>


</body>

</html>
