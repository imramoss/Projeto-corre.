<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Treinos | Projeto Corre</title>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
background:#080808;
color:white;
font-family:Poppins,Arial,sans-serif;
}

header {
padding:20px 5%;
border-bottom:1px solid #292929;
}

header a {
color:#A3FF12;
text-decoration:none;
}

main {
width:min(1000px,92%);
margin:auto;
padding:50px 0;
}

h1 {
font-size:40px;
}

p {
color:#777;
}

.training {
margin-top:30px;
padding:30px;
background:#151515;
border:1px solid #292929;
border-radius:20px;
}

.tag {
color:#A3FF12;
font-size:12px;
font-weight:bold;
}

.training h2 {
font-size:25px;
}

.item {
padding:18px 0;
border-bottom:1px solid #292929;
}

.item strong {
display:block;
}

.item span {
color:#777;
font-size:13px;
}

button {
margin-top:25px;
background:#A3FF12;
border:0;
padding:15px 25px;
border-radius:12px;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<a href="dashboard.html">
← Voltar para o painel
</a>

</header>

<main>

<h1>
Meu treino
</h1>

<p>
Seu treino atual foi preparado para
quem está começando.
</p>

<div class="training">

<div class="tag">
TREINO 01
</div>

<h2>
Começando a correr
</h2>

<div class="item">

<strong>
5 minutos
</strong>

<span>
Caminhada leve
</span>

</div>

<div class="item">

<strong>
1 minuto
</strong>

<span>
Corrida leve
</span>

</div>

<div class="item">

<strong>
2 minutos
</strong>

<span>
Caminhada
</span>

</div>

<div class="item">

<strong>
Repetir 4 vezes
</strong>

<span>
Mantenha um ritmo confortável.
</span>

</div>

<button onclick="alert('Treino iniciado!')">
Começar treino
</button>

</div>

</main>

</body>

</html>
