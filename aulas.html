<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Aulas do Projeto Corre.">

    <meta
        name="theme-color"
        content="#A3FF12">

    <title>Projeto Corre | Aulas</title>

    <!-- GOOGLE FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        :root {

            --green: #A3FF12;
            --green-dark: #7fc900;

            --black: #080808;
            --dark: #101010;
            --dark-2: #151515;
            --dark-3: #1c1c1c;

            --white: #ffffff;

            --gray: #777;
            --gray-light: #aaa;

            --border: #292929;

            --danger: #ff5555;

        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 85% 5%,
                    rgba(163,255,18,.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 5% 90%,
                    rgba(163,255,18,.04),
                    transparent 30%
                ),
                var(--black);

            color: var(--white);

            font-family: "Poppins", sans-serif;

            overflow-x: hidden;

        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button {
            font-family: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 100;

            width: 100%;

            height: 75px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            background:
                rgba(8,8,8,.90);

            border-bottom:
                1px solid rgba(255,255,255,.06);

            backdrop-filter:
                blur(15px);

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 20px;

            font-weight: 800;

            white-space: nowrap;

        }


        .logo i {

            color: var(--green);

            font-size: 24px;

        }


        .logo span {

            color: var(--green);

        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 20px;

        }


        .back {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #777;

            font-size: 12px;

            transition: .2s;

        }


        .back:hover {

            color: var(--green);

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width: min(1100px, 92%);

            margin: auto;

            padding: 50px 0 80px;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 25px;

            margin-bottom: 35px;

        }


        .hero-text {

            max-width: 650px;

        }


        .eyebrow {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 10px;

            color: var(--green);

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .8px;

        }


        .eyebrow i {

            font-size: 10px;

        }


        h1 {

            font-size: 34px;

            line-height: 1.15;

            letter-spacing: -1px;

            margin-bottom: 10px;

        }


        h1 span {

            color: var(--green);

        }


        .subtitle {

            color: #666;

            font-size: 13px;

            line-height: 1.7;

        }


        /* =====================================================
           CONTADOR
        ===================================================== */

        .lesson-counter {

            min-width: 130px;

            padding: 15px 18px;

            background: rgba(255,255,255,.025);

            border: 1px solid #222;

            border-radius: 14px;

            text-align: center;

        }


        .lesson-counter strong {

            display: block;

            color: var(--green);

            font-size: 23px;

            line-height: 1;

            margin-bottom: 5px;

        }


        .lesson-counter span {

            color: #666;

            font-size: 10px;

        }


        /* =====================================================
           FILTROS
        ===================================================== */

        .toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 25px;

        }


        .search-box {

            position: relative;

            flex: 1;

            max-width: 400px;

        }


        .search-box i {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            color: #555;

            font-size: 13px;

        }


        .search-box input {

            width: 100%;

            height: 44px;

            padding: 0 15px 0 40px;

            background: #101010;

            border: 1px solid #252525;

            border-radius: 11px;

            outline: none;

            color: white;

            font-family: inherit;

            font-size: 12px;

            transition: .2s;

        }


        .search-box input::placeholder {

            color: #555;

        }


        .search-box input:focus {

            border-color: var(--green);

        }


        .category-filter {

            height: 44px;

            padding: 0 14px;

            background: #101010;

            color: #aaa;

            border: 1px solid #252525;

            border-radius: 11px;

            outline: none;

            font-family: inherit;

            font-size: 11px;

            cursor: pointer;

        }


        .category-filter:focus {

            border-color: var(--green);

        }


        .category-filter option {

            background: #101010;

            color: white;

        }


        /* =====================================================
           GRID
        ===================================================== */

        .lessons-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .lesson-card {

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0f0f0f
                );

            border:
                1px solid #292929;

            border-radius: 19px;

            transition:
                transform .25s,
                border-color .25s,
                box-shadow .25s;

        }


        .lesson-card:hover {

            transform: translateY(-4px);

            border-color:
                rgba(163,255,18,.35);

            box-shadow:
                0 18px 45px rgba(0,0,0,.30);

        }


        /* =====================================================
           THUMBNAIL
        ===================================================== */

        .lesson-thumbnail {

            position: relative;

            width: 100%;

            height: 205px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #1b1b1b,
                    #0d0d0d
                );

        }


        .lesson-thumbnail img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform .4s;

        }


        .lesson-card:hover
        .lesson-thumbnail img {

            transform: scale(1.04);

        }


        .thumbnail-placeholder {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle,
                    rgba(163,255,18,.10),
                    transparent 55%
                );

        }


        .thumbnail-placeholder i {

            color:
                rgba(163,255,18,.65);

            font-size: 42px;

        }


        /* =====================================================
           PLAY
        ===================================================== */

        .play-button {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 52px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(163,255,18,.95);

            color: #080808;

            font-size: 17px;

            box-shadow:
                0 8px 25px rgba(0,0,0,.4);

            opacity: .95;

            transition: .25s;

        }


        .lesson-card:hover
        .play-button {

            transform:
                translate(-50%, -50%)
                scale(1.08);

        }


        /* =====================================================
           CATEGORIA
        ===================================================== */

        .category-badge {

            position: absolute;

            left: 13px;

            top: 13px;

            padding: 6px 9px;

            border-radius: 7px;

            background:
                rgba(0,0,0,.72);

            border:
                1px solid rgba(255,255,255,.08);

            color: var(--green);

            font-size: 9px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .5px;

            backdrop-filter:
                blur(8px);

        }


        /* =====================================================
           CONTEÚDO DO CARD
        ===================================================== */

        .lesson-content {

            padding: 21px;

        }


        .lesson-number {

            display: block;

            margin-bottom: 7px;

            color: #555;

            font-size: 9px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: .7px;

        }


        .lesson-title {

            font-size: 17px;

            line-height: 1.3;

            margin-bottom: 8px;

        }


        .lesson-description {

            color: #707070;

            font-size: 11px;

            line-height: 1.7;

            min-height: 38px;

        }


        .lesson-footer {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-top: 18px;

            padding-top: 15px;

            border-top:
                1px solid #222;

        }


        .lesson-info {

            display: flex;

            align-items: center;

            gap: 5px;

            color: #555;

            font-size: 9px;

        }


        .lesson-info i {

            color: var(--green);

        }


        .watch-button {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 10px 14px;

            border-radius: 9px;

            background: var(--green);

            color: #080808;

            font-size: 10px;

            font-weight: 800;

            transition: .2s;

        }


        .watch-button:hover {

            background:
                var(--green-dark);

            transform:
                translateY(-1px);

        }


        /* =====================================================
           ESTADOS
        ===================================================== */

        .state {

            grid-column: 1 / -1;

            padding: 60px 20px;

            text-align: center;

            background: #101010;

            border:
                1px solid #222;

            border-radius: 18px;

        }


        .state i {

            display: block;

            margin-bottom: 15px;

            color: #555;

            font-size: 32px;

        }


        .state h2 {

            font-size: 16px;

            margin-bottom: 7px;

        }


        .state p {

            color: #666;

            font-size: 11px;

            line-height: 1.6;

        }


        .loading i {

            color: var(--green);

        }


        .loading i {

            animation:
                spin 1s linear infinite;

        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           ERRO
        ===================================================== */

        .error-state i {

            color: var(--danger);

        }


        .retry-button {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-top: 17px;

            padding: 10px 15px;

            border: none;

            border-radius: 9px;

            background: var(--green);

            color: #080808;

            font-size: 10px;

            font-weight: 800;

            cursor: pointer;

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 700px) {

            header {

                padding: 0 5%;

            }


            main {

                width: 92%;

                padding-top: 35px;

            }


            .hero {

                align-items: flex-start;

                flex-direction: column;

            }


            .lesson-counter {

                width: 100%;

            }


            .toolbar {

                align-items: stretch;

                flex-direction: column;

            }


            .search-box {

                max-width: none;

            }


            .lessons-grid {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 450px) {

            .logo {

                font-size: 17px;

            }


            .back {

                font-size: 0;

            }


            .back i {

                font-size: 14px;

            }


            h1 {

                font-size: 28px;

            }


            .lesson-thumbnail {

                height: 190px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <a
        href="painel.html"
        class="logo">

        <i class="fa-solid fa-person-running"></i>

        Projeto <span>Corre</span>

    </a>


    <div class="header-right">

        <a
            href="painel.html"
            class="back">

            <i class="fa-solid fa-arrow-left"></i>

            Voltar para o painel

        </a>

    </div>

</header>



<!-- =========================================================
     CONTEÚDO
========================================================= -->

<main>


    <!-- HERO -->

    <section class="hero">

        <div class="hero-text">

            <div class="eyebrow">

                <i class="fa-solid fa-graduation-cap"></i>

                Área de aprendizado

            </div>


            <h1>

                Aulas do
                <span>Projeto Corre.</span>

            </h1>


            <p class="subtitle">

                Aprenda a correr melhor, evolua seus treinos
                e construa uma rotina mais eficiente.

            </p>

        </div>


        <div class="lesson-counter">

            <strong id="lessonCount">
                —
            </strong>

            <span>
                aulas disponíveis
            </span>

        </div>

    </section>



    <!-- =====================================================
         FILTROS
    ===================================================== -->

    <section class="toolbar">


        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="search"
                id="searchInput"
                placeholder="Buscar uma aula..."
                autocomplete="off">

        </div>


        <select
            class="category-filter"
            id="categoryFilter">

            <option value="">
                Todas as categorias
            </option>

        </select>


    </section>



    <!-- =====================================================
         AULAS
    ===================================================== -->

    <section
        class="lessons-grid"
        id="lessonsGrid">


        <!-- CARREGANDO -->

        <div
            class="state loading">

            <i class="fa-solid fa-spinner"></i>

            <h2>
                Carregando aulas...
            </h2>

            <p>
                Buscando os conteúdos do Projeto Corre.
            </p>

        </div>


    </section>


</main>



<script>

    /* =========================================================
       CONFIGURAÇÃO SUPABASE
    ========================================================= */

    const SUPABASE_URL =
        "https://mubzyyppizxuofitnysp.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_7TMsNk3z-oks9HQjTfi6ug_dy0Rvaw0";


    /* =========================================================
       ELEMENTOS
    ========================================================= */

    const lessonsGrid =
        document.getElementById("lessonsGrid");

    const lessonCount =
        document.getElementById("lessonCount");

    const searchInput =
        document.getElementById("searchInput");

    const categoryFilter =
        document.getElementById("categoryFilter");


    /* =========================================================
       DADOS
    ========================================================= */

    let allLessons = [];


    /* =========================================================
       CABEÇALHOS
    ========================================================= */

    const headers = {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " + SUPABASE_KEY,

        "Content-Type":
            "application/json"

    };


    /* =========================================================
       CARREGAR AULAS
    ========================================================= */

    async function loadLessons() {

        showLoading();


        try {

            const response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/lessons" +
                    "?select=*" +
                    "&order=created_at.asc",
                    {
                        method: "GET",
                        headers: headers
                    }
                );


            if (!response.ok) {

                let errorText =
                    await response.text();

                throw new Error(
                    errorText ||
                    "Não foi possível carregar as aulas."
                );

            }


            const data =
                await response.json();


            allLessons =
                Array.isArray(data)
                    ? data
                    : [];


            buildCategories();

            renderLessons();


        } catch (error) {

            console.error(
                "Erro ao carregar aulas:",
                error
            );

            showError();

        }

    }


    /* =========================================================
       CATEGORIAS
    ========================================================= */

    function buildCategories() {

        categoryFilter.innerHTML = `
            <option value="">
                Todas as categorias
            </option>
        `;


        const categories =
            [
                ...new Set(
                    allLessons
                        .map(
                            lesson =>
                                getCategory(lesson)
                        )
                        .filter(Boolean)
                )
            ];


        categories.sort(
            (a, b) =>
                a.localeCompare(b)
        );


        categories.forEach(
            category => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    category;

                option.textContent =
                    category;

                categoryFilter.appendChild(
                    option
                );

            }
        );

    }


    /* =========================================================
       CATEGORIA
    ========================================================= */

    function getCategory(lesson) {

        return (

            lesson.category ||

            lesson.categoria ||

            lesson.type ||

            lesson.tipo ||

            ""

        ).toString().trim();

    }


    /* =========================================================
       TÍTULO
    ========================================================= */

    function getTitle(lesson) {

        return (

            lesson.title ||

            lesson.titulo ||

            lesson.name ||

            lesson.nome ||

            "Aula do Projeto Corre"

        ).toString();

    }


    /* =========================================================
       DESCRIÇÃO
    ========================================================= */

    function getDescription(lesson) {

        return (

            lesson.description ||

            lesson.descricao ||

            lesson.content ||

            lesson.conteudo ||

            "Conteúdo exclusivo do Projeto Corre."

        ).toString();

    }


    /* =========================================================
       IMAGEM
    ========================================================= */

    function getImage(lesson) {

        return (

            lesson.thumbnail_url ||

            lesson.thumbnail ||

            lesson.image_url ||

            lesson.image ||

            lesson.cover_url ||

            lesson.cover ||

            ""

        ).toString().trim();

    }


    /* =========================================================
       VÍDEO
    ========================================================= */

    function getVideo(lesson) {

        return (

            lesson.video_url ||

            lesson.video ||

            lesson.url ||

            lesson.link ||

            ""

        ).toString().trim();

    }


    /* =========================================================
       DURAÇÃO
    ========================================================= */

    function getDuration(lesson) {

        return (

            lesson.duration ||

            lesson.duracao ||

            ""

        ).toString().trim();

    }


    /* =========================================================
       FILTRAR
    ========================================================= */

    function getFilteredLessons() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const category =
            categoryFilter.value;


        return allLessons.filter(
            lesson => {

                const title =
                    getTitle(lesson)
                        .toLowerCase();

                const description =
                    getDescription(lesson)
                        .toLowerCase();

                const lessonCategory =
                    getCategory(lesson);


                const matchesSearch =
                    !search ||
                    title.includes(search) ||
                    description.includes(search);


                const matchesCategory =
                    !category ||
                    lessonCategory === category;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );

    }


    /* =========================================================
       RENDERIZAR
    ========================================================= */

    function renderLessons() {

        const lessons =
            getFilteredLessons();


        lessonCount.textContent =
            allLessons.length;


        if (!lessons.length) {

            showEmpty(
                allLessons.length
                    ? "Nenhuma aula encontrada"
                    : "Nenhuma aula disponível"
            );

            return;

        }


        lessonsGrid.innerHTML = "";


        lessons.forEach(
            (lesson, index) => {

                const card =
                    createLessonCard(
                        lesson,
                        index
                    );

                lessonsGrid.appendChild(
                    card
                );

            }
        );

    }


    /* =========================================================
       CRIAR CARD
    ========================================================= */

    function createLessonCard(
        lesson,
        index
    ) {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "lesson-card";


        const title =
            getTitle(lesson);

        const description =
            getDescription(lesson);

        const category =
            getCategory(lesson);

        const image =
            getImage(lesson);

        const video =
            getVideo(lesson);

        const duration =
            getDuration(lesson);


        const number =
            String(index + 1)
                .padStart(2, "0");


        /* =====================================================
           THUMBNAIL
        ===================================================== */

        let thumbnail;


        if (image) {

            thumbnail = `
                <img
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(title)}"
                    loading="lazy"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

                <div
                    class="thumbnail-placeholder"
                    style="display:none;">

                    <i class="fa-solid fa-person-running"></i>

                </div>
            `;

        } else {

            thumbnail = `
                <div class="thumbnail-placeholder">

                    <i class="fa-solid fa-person-running"></i>

                </div>
            `;

        }


        /* =====================================================
           CATEGORIA
        ===================================================== */

        const categoryHTML =
            category
                ? `
                    <span class="category-badge">
                        ${escapeHTML(category)}
                    </span>
                  `
                : "";


        /* =====================================================
           DURAÇÃO
        ===================================================== */

        const durationHTML =
            duration
                ? `
                    <span class="lesson-info">
                        <i class="fa-regular fa-clock"></i>
                        ${escapeHTML(duration)}
                    </span>
                  `
                : `
                    <span class="lesson-info">
                        <i class="fa-solid fa-play"></i>
                        Aula
                    </span>
                  `;


        /* =====================================================
           BOTÃO
        ===================================================== */

        let buttonHTML;


        if (video) {

            buttonHTML = `
                <a
                    class="watch-button"
                    href="${escapeAttribute(video)}"
                    target="_blank"
                    rel="noopener noreferrer">

                    Assistir

                    <i class="fa-solid fa-play"></i>

                </a>
            `;

        } else {

            buttonHTML = `
                <button
                    class="watch-button"
                    type="button"
                    onclick="showVideoUnavailable()">

                    Assistir

                    <i class="fa-solid fa-play"></i>

                </button>
            `;

        }


        /* =====================================================
           CARD
        ===================================================== */

        card.innerHTML = `

            <div class="lesson-thumbnail">

                ${thumbnail}

                ${categoryHTML}

                <div class="play-button">

                    <i class="fa-solid fa-play"></i>

                </div>

            </div>


            <div class="lesson-content">

                <span class="lesson-number">
                    AULA ${number}
                </span>


                <h2 class="lesson-title">
                    ${escapeHTML(title)}
                </h2>


                <p class="lesson-description">
                    ${escapeHTML(description)}
                </p>


                <div class="lesson-footer">

                    ${durationHTML}

                    ${buttonHTML}

                </div>

            </div>

        `;


        return card;

    }


    /* =========================================================
       HTML SEGURO
    ========================================================= */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

        return escapeHTML(value);

    }


    /* =========================================================
       LOADING
    ========================================================= */

    function showLoading() {

        lessonsGrid.innerHTML = `

            <div class="state loading">

                <i class="fa-solid fa-spinner"></i>

                <h2>
                    Carregando aulas...
                </h2>

                <p>
                    Buscando os conteúdos do Projeto Corre.
                </p>

            </div>

        `;

    }


    /* =========================================================
       VAZIO
    ========================================================= */

    function showEmpty(title) {

        lessonsGrid.innerHTML = `

            <div class="state">

                <i class="fa-solid fa-book-open"></i>

                <h2>
                    ${escapeHTML(title)}
                </h2>

                <p>
                    Tente alterar os filtros ou volte mais tarde.
                </p>

            </div>

        `;

    }


    /* =========================================================
       ERRO
    ========================================================= */

    function showError() {

        lessonsGrid.innerHTML = `

            <div class="state error-state">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <h2>
                    Não foi possível carregar as aulas
                </h2>

                <p>
                    Verifique sua conexão e tente novamente.
                </p>

                <button
                    class="retry-button"
                    type="button"
                    onclick="loadLessons()">

                    <i class="fa-solid fa-rotate-right"></i>

                    Tentar novamente

                </button>

            </div>

        `;


        lessonCount.textContent =
            "—";

    }


    /* =========================================================
       VÍDEO NÃO DISPONÍVEL
    ========================================================= */

    function showVideoUnavailable() {

        alert(
            "O vídeo desta aula ainda não foi cadastrado."
        );

    }


    /* =========================================================
       BUSCA
    ========================================================= */

    searchInput.addEventListener(
        "input",
        renderLessons
    );


    /* =========================================================
       CATEGORIA
    ========================================================= */

    categoryFilter.addEventListener(
        "change",
        renderLessons
    );


    /* =========================================================
       INICIAR
    ========================================================= */

    loadLessons();

</script>


</body>

</html>
