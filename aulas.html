<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Aulas do Projeto Corre para melhorar sua corrida.">

    <meta
        name="theme-color"
        content="#A3FF12">

    <title>Projeto Corre | Aulas</title>


    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        :root {

            --green: #A3FF12;
            --green-dark: #78c400;

            --black: #080808;

            --dark: #101010;
            --dark-2: #151515;
            --dark-3: #1d1d1d;

            --white: #ffffff;

            --gray: #777;
            --gray-light: #aaa;

            --border: #292929;

        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            font-family:
                "Poppins",
                sans-serif;

            background:

                radial-gradient(
                    circle at 80% 0%,
                    rgba(163,255,18,.09),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 0% 100%,
                    rgba(163,255,18,.04),
                    transparent 30%
                ),

                var(--black);

            color: var(--white);

            overflow-x: hidden;

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        button,
        input {

            font-family: inherit;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            width: 100%;

            height: 75px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0
                7%;

            border-bottom:
                1px solid
                rgba(255,255,255,.06);

            background:
                rgba(8,8,8,.92);

            backdrop-filter:
                blur(15px);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 20px;

            font-weight: 800;

        }


        .logo i {

            color:
                var(--green);

            font-size: 23px;

        }


        .logo span {

            color:
                var(--green);

        }


        .back {

            display: flex;

            align-items: center;

            gap: 7px;

            color:
                var(--gray);

            font-size: 12px;

            transition: .2s;

        }


        .back:hover {

            color:
                var(--green);

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width: min(
                1150px,
                92%
            );

            margin:
                auto;

            padding:
                50px 0 70px;

        }


        /* =====================================================
           CABEÇALHO DA PÁGINA
        ===================================================== */

        .page-header {

            margin-bottom:
                30px;

        }


        .page-header h1 {

            font-size:
                clamp(
                    27px,
                    4vw,
                    36px
                );

            line-height:
                1.15;

            letter-spacing:
                -1px;

        }


        .page-header h1 span {

            color:
                var(--green);

        }


        .page-header p {

            margin-top:
                10px;

            color:
                #666;

            font-size:
                13px;

        }


        /* =====================================================
           BARRA DE BUSCA
        ===================================================== */

        .toolbar {

            display:
                flex;

            gap:
                12px;

            margin-bottom:
                25px;

            flex-wrap:
                wrap;

        }


        .search-box {

            flex:
                1;

            min-width:
                230px;

            position:
                relative;

        }


        .search-box i {

            position:
                absolute;

            left:
                15px;

            top:
                50%;

            transform:
                translateY(-50%);

            color:
                #555;

        }


        .search-box input {

            width:
                100%;

            height:
                46px;

            padding:
                0 15px 0 43px;

            background:
                #101010;

            border:
                1px solid
                var(--border);

            border-radius:
                11px;

            outline:
                none;

            color:
                white;

            font-size:
                12px;

            transition:
                .2s;

        }


        .search-box input::placeholder {

            color:
                #555;

        }


        .search-box input:focus {

            border-color:
                var(--green);

            box-shadow:
                0 0 0 3px
                rgba(163,255,18,.05);

        }


        /* =====================================================
           FILTROS
        ===================================================== */

        .filters {

            display:
                flex;

            gap:
                8px;

            flex-wrap:
                wrap;

        }


        .filter {

            height:
                46px;

            padding:
                0 15px;

            border:
                1px solid
                var(--border);

            border-radius:
                11px;

            background:
                #101010;

            color:
                #777;

            cursor:
                pointer;

            font-size:
                11px;

            transition:
                .2s;

        }


        .filter:hover {

            border-color:
                #444;

            color:
                white;

        }


        .filter.active {

            background:
                var(--green);

            border-color:
                var(--green);

            color:
                #080808;

            font-weight:
                700;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            display:
                none;

            margin-bottom:
                20px;

            padding:
                14px 16px;

            border-radius:
                11px;

            font-size:
                12px;

            line-height:
                1.5;

        }


        .status.loading {

            display:
                block;

            background:
                rgba(255,255,255,.03);

            border:
                1px solid
                #222;

            color:
                #777;

        }


        .status.error {

            display:
                block;

            background:
                rgba(255,60,60,.08);

            border:
                1px solid
                rgba(255,60,60,.22);

            color:
                #ff8585;

        }


        .status.success {

            display:
                block;

            background:
                rgba(163,255,18,.06);

            border:
                1px solid
                rgba(163,255,18,.18);

            color:
                var(--green);

        }


        /* =====================================================
           GRID
        ===================================================== */

        .lessons-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                18px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .lesson-card {

            background:
                linear-gradient(
                    145deg,
                    #151515,
                    #0e0e0e
                );

            border:
                1px solid
                var(--border);

            border-radius:
                18px;

            overflow:
                hidden;

            transition:
                transform .25s,
                border-color .25s,
                box-shadow .25s;

        }


        .lesson-card:hover {

            transform:
                translateY(-4px);

            border-color:
                rgba(163,255,18,.25);

            box-shadow:
                0 18px 45px
                rgba(0,0,0,.35);

        }


        /* =====================================================
           THUMBNAIL
        ===================================================== */

        .thumbnail {

            height:
                165px;

            background:
                linear-gradient(
                    135deg,
                    #171717,
                    #0c0c0c
                );

            position:
                relative;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

        }


        .thumbnail img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            display:
                block;

        }


        .thumbnail-placeholder {

            width:
                58px;

            height:
                58px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                17px;

            background:
                rgba(163,255,18,.08);

            border:
                1px solid
                rgba(163,255,18,.18);

            color:
                var(--green);

            font-size:
                23px;

        }


        .level {

            position:
                absolute;

            top:
                12px;

            right:
                12px;

            padding:
                6px 9px;

            border-radius:
                7px;

            background:
                rgba(0,0,0,.75);

            border:
                1px solid
                rgba(255,255,255,.08);

            color:
                #ccc;

            font-size:
                9px;

            backdrop-filter:
                blur(8px);

        }


        /* =====================================================
           CARD CONTENT
        ===================================================== */

        .lesson-content {

            padding:
                20px;

        }


        .category {

            color:
                var(--green);

            text-transform:
                uppercase;

            letter-spacing:
                .8px;

            font-size:
                8px;

            font-weight:
                700;

            margin-bottom:
                8px;

        }


        .lesson-content h2 {

            font-size:
                16px;

            line-height:
                1.4;

            margin-bottom:
                8px;

        }


        .description {

            color:
                #666;

            font-size:
                11px;

            line-height:
                1.7;

            min-height:
                56px;

        }


        /* =====================================================
           META
        ===================================================== */

        .lesson-meta {

            display:
                flex;

            align-items:
                center;

            gap:
                13px;

            margin-top:
                15px;

            padding-top:
                13px;

            border-top:
                1px solid
                #202020;

            color:
                #666;

            font-size:
                10px;

        }


        .lesson-meta span {

            display:
                flex;

            align-items:
                center;

            gap:
                5px;

        }


        .lesson-meta i {

            color:
                var(--green);

        }


        /* =====================================================
           BOTÃO
        ===================================================== */

        .watch-btn {

            width:
                100%;

            height:
                42px;

            margin-top:
                16px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                8px;

            border:
                none;

            border-radius:
                10px;

            background:
                var(--green);

            color:
                #080808;

            font-size:
                11px;

            font-weight:
                800;

            cursor:
                pointer;

            transition:
                .2s;

        }


        .watch-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 25px
                rgba(163,255,18,.13);

        }


        .watch-btn.disabled {

            background:
                #222;

            color:
                #666;

            cursor:
                not-allowed;

            box-shadow:
                none;

        }


        .watch-btn.disabled:hover {

            transform:
                none;

        }


        /* =====================================================
           VAZIO
        ===================================================== */

        .empty {

            display:
                none;

            text-align:
                center;

            padding:
                60px 20px;

            border:
                1px solid
                var(--border);

            border-radius:
                18px;

            background:
                rgba(255,255,255,.015);

        }


        .empty.show {

            display:
                block;

        }


        .empty i {

            color:
                var(--green);

            font-size:
                32px;

            margin-bottom:
                15px;

        }


        .empty h2 {

            font-size:
                17px;

            margin-bottom:
                7px;

        }


        .empty p {

            color:
                #666;

            font-size:
                11px;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                18px;

        }


        .skeleton {

            height:
                360px;

            border-radius:
                18px;

            background:
                linear-gradient(
                    90deg,
                    #111 25%,
                    #181818 50%,
                    #111 75%
                );

            background-size:
                200% 100%;

            animation:
                loading 1.5s infinite;

            border:
                1px solid
                #202020;

        }


        @keyframes loading {

            0% {
                background-position:
                    200% 0;
            }

            100% {
                background-position:
                    -200% 0;
            }

        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {

            position:
                fixed;

            inset:
                0;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            background:
                rgba(0,0,0,.80);

            backdrop-filter:
                blur(8px);

            z-index:
                1000;

        }


        .modal.show {

            display:
                flex;

        }


        .modal-box {

            width:
                min(
                    800px,
                    100%
                );

            max-height:
                90vh;

            overflow:
                auto;

            background:
                #111;

            border:
                1px solid
                #292929;

            border-radius:
                20px;

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.6);

        }


        .modal-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                20px;

            border-bottom:
                1px solid
                #222;

        }


        .modal-header h2 {

            font-size:
                17px;

        }


        .close-modal {

            width:
                34px;

            height:
                34px;

            border:
                1px solid
                #292929;

            border-radius:
                9px;

            background:
                #171717;

            color:
                #777;

            cursor:
                pointer;

        }


        .close-modal:hover {

            color:
                white;

        }


        .video-container {

            background:
                #050505;

            aspect-ratio:
                16 / 9;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

        }


        .video-container iframe {

            width:
                100%;

            height:
                100%;

            border:
                none;

        }


        .video-placeholder {

            text-align:
                center;

            padding:
                30px;

            color:
                #666;

        }


        .video-placeholder i {

            color:
                var(--green);

            font-size:
                35px;

            margin-bottom:
                12px;

        }


        .modal-description {

            padding:
                20px;

            color:
                #777;

            font-size:
                12px;

            line-height:
                1.8;

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media(max-width: 900px) {

            .lessons-grid,
            .loading-grid {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }

        }


        @media(max-width: 600px) {

            header {

                padding:
                    0 5%;

            }


            main {

                width:
                    92%;

                padding-top:
                    35px;

            }


            .lessons-grid,
            .loading-grid {

                grid-template-columns:
                    1fr;

            }


            .thumbnail {

                height:
                    190px;

            }


            .toolbar {

                flex-direction:
                    column;

            }


            .filters {

                width:
                    100%;

                overflow-x:
                    auto;

                flex-wrap:
                    nowrap;

                padding-bottom:
                    3px;

            }


            .filter {

                flex-shrink:
                    0;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <a
        href="painel.html"
        class="logo">

        <i class="fa-solid fa-person-running"></i>

        <span>Corre</span>

    </a>


    <a
        href="painel.html"
        class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Voltar

    </a>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <section class="page-header">

        <h1>

            Aulas
            <span>Projeto Corre</span>

        </h1>

        <p>

            Conteúdos para melhorar sua técnica,
            desempenho e evolução na corrida.

        </p>

    </section>


    <!-- =================================================
         BUSCA E FILTROS
    ================================================== -->

    <div class="toolbar">


        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="search"
                id="searchInput"
                placeholder="Pesquisar aula...">

        </div>


        <div class="filters">

            <button
                class="filter active"
                data-category="todos">

                Todas

            </button>


            <button
                class="filter"
                data-category="tecnica">

                Técnica

            </button>


            <button
                class="filter"
                data-category="respiracao">

                Respiração

            </button>


            <button
                class="filter"
                data-category="forca">

                Força

            </button>


            <button
                class="filter"
                data-category="ritmo">

                Ritmo

            </button>

        </div>

    </div>


    <!-- =================================================
         STATUS
    ================================================== -->

    <div
        id="status"
        class="status">

    </div>


    <!-- =================================================
         LOADING
    ================================================== -->

    <div
        id="loadingGrid"
        class="loading-grid">

        <div class="skeleton"></div>

        <div class="skeleton"></div>

        <div class="skeleton"></div>

    </div>


    <!-- =================================================
         AULAS
    ================================================== -->

    <div
        id="lessonsGrid"
        class="lessons-grid">

    </div>


    <!-- =================================================
         VAZIO
    ================================================== -->

    <div
        id="empty"
        class="empty">

        <i class="fa-solid fa-person-running"></i>

        <h2>
            Nenhuma aula encontrada
        </h2>

        <p>
            Ainda não existem aulas publicadas
            para esta categoria.
        </p>

    </div>


</main>


<!-- =====================================================
     MODAL DA AULA
===================================================== -->

<div
    class="modal"
    id="lessonModal">


    <div class="modal-box">


        <div class="modal-header">

            <h2 id="modalTitle">
                Aula
            </h2>


            <button
                class="close-modal"
                id="closeModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>


        <div
            class="video-container"
            id="videoContainer">

        </div>


        <div
            class="modal-description"
            id="modalDescription">

        </div>


    </div>

</div>


<!-- =====================================================
     SCRIPT
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    async function () {


        /* =================================================
           CONFIGURAÇÃO SUPABASE
        ================================================= */

        const SUPABASE_URL =
            "https://mubzyyppizxuofitnysp.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_7TMsNk3z-oks9HQjTfi6ug_dy0Rvaw0";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =================================================
           ELEMENTOS
        ================================================= */

        const lessonsGrid =
            document.getElementById(
                "lessonsGrid"
            );


        const loadingGrid =
            document.getElementById(
                "loadingGrid"
            );


        const empty =
            document.getElementById(
                "empty"
            );


        const status =
            document.getElementById(
                "status"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const filters =
            document.querySelectorAll(
                ".filter"
            );


        const modal =
            document.getElementById(
                "lessonModal"
            );


        const closeModal =
            document.getElementById(
                "closeModal"
            );


        const modalTitle =
            document.getElementById(
                "modalTitle"
            );


        const modalDescription =
            document.getElementById(
                "modalDescription"
            );


        const videoContainer =
            document.getElementById(
                "videoContainer"
            );


        /* =================================================
           VARIÁVEIS
        ================================================= */

        let lessons = [];

        let currentCategory =
            "todos";


        /* =================================================
           STATUS
        ================================================= */

        function showStatus(
            text,
            type
        ) {

            status.textContent =
                text;

            status.className =
                "status " + type;

        }


        function hideStatus() {

            status.textContent =
                "";

            status.className =
                "status";

        }


        /* =================================================
           ÍCONE POR CATEGORIA
        ================================================= */

        function getCategoryIcon(
            category
        ) {

            switch (
                String(category)
                    .toLowerCase()
            ) {

                case "tecnica":
                    return "fa-shoe-prints";

                case "respiracao":
                    return "fa-heart-pulse";

                case "forca":
                    return "fa-dumbbell";

                case "ritmo":
                    return "fa-clock";

                default:
                    return "fa-person-running";

            }

        }


        /* =================================================
           NOME DA CATEGORIA
        ================================================= */

        function getCategoryName(
            category
        ) {

            switch (
                String(category)
                    .toLowerCase()
            ) {

                case "tecnica":
                    return "Técnica";

                case "respiracao":
                    return "Respiração";

                case "forca":
                    return "Força";

                case "ritmo":
                    return "Ritmo";

                default:
                    return "Corrida";

            }

        }


        /* =================================================
           ESCAPAR HTML
        ================================================= */

        function escapeHTML(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =================================================
           CARREGAR AULAS
        ================================================= */

        async function loadLessons() {

            try {

                loadingGrid.style.display =
                    "grid";

                lessonsGrid.innerHTML =
                    "";

                empty.classList.remove(
                    "show"
                );


                showStatus(
                    "Carregando aulas...",
                    "loading"
                );


                const {
                    data,
                    error
                } = await supabaseClient

                    .from("lessons")

                    .select(
                        `
                        id,
                        title,
                        description,
                        category,
                        duration,
                        level,
                        video_url,
                        thumbnail_url,
                        is_published,
                        sort_order,
                        created_at
                        `
                    )

                    .eq(
                        "is_published",
                        true
                    )

                    .order(
                        "sort_order",
                        {
                            ascending: true
                        }
                    );


                console.log(
                    "AULAS SUPABASE:",
                    data
                );


                if (error) {

                    console.error(
                        "ERRO SUPABASE:",
                        error
                    );

                    throw error;

                }


                lessons =
                    Array.isArray(data)
                        ? data
                        : [];


                loadingGrid.style.display =
                    "none";


                hideStatus();


                if (
                    lessons.length === 0
                ) {

                    empty.classList.add(
                        "show"
                    );

                    return;

                }


                renderLessons();

            }

            catch (error) {

                console.error(
                    error
                );


                loadingGrid.style.display =
                    "none";


                lessonsGrid.innerHTML =
                    "";


                empty.classList.remove(
                    "show"
                );


                showStatus(
                    "Não foi possível carregar as aulas. Verifique a conexão com o Supabase e as permissões da tabela lessons.",
                    "error"
                );

            }

        }


        /* =================================================
           FILTRAR AULAS
        ================================================= */

        function getFilteredLessons() {

            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            return lessons.filter(
                function (lesson) {


                    const category =
                        String(
                            lesson.category || ""
                        ).toLowerCase();


                    const title =
                        String(
                            lesson.title || ""
                        ).toLowerCase();


                    const description =
                        String(
                            lesson.description || ""
                        ).toLowerCase();


                    const categoryMatch =
                        currentCategory ===
                        "todos"
                        ||
                        category ===
                        currentCategory;


                    const searchMatch =
                        !search
                        ||
                        title.includes(search)
                        ||
                        description.includes(search);


                    return (
                        categoryMatch &&
                        searchMatch
                    );

                }
            );

        }


        /* =================================================
           RENDERIZAR
        ================================================= */

        function renderLessons() {

            const filtered =
                getFilteredLessons();


            lessonsGrid.innerHTML =
                "";


            if (
                filtered.length === 0
            ) {

                empty.classList.add(
                    "show"
                );

                return;

            }


            empty.classList.remove(
                "show"
            );


            filtered.forEach(
                function (lesson) {

                    const card =
                        createLessonCard(
                            lesson
                        );


                    lessonsGrid.appendChild(
                        card
                    );

                }
            );

        }


        /* =================================================
           CRIAR CARD
        ================================================= */

        function createLessonCard(
            lesson
        ) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "lesson-card";


            const title =
                escapeHTML(
                    lesson.title
                );


            const description =
                escapeHTML(
                    lesson.description
                );


            const category =
                escapeHTML(
                    getCategoryName(
                        lesson.category
                    )
                );


            const level =
                escapeHTML(
                    lesson.level ||
                    "Todos os níveis"
                );


            const duration =
                Number(
                    lesson.duration
                ) || 0;


            const thumbnail =
                lesson.thumbnail_url;


            const video =
                lesson.video_url;


            const icon =
                getCategoryIcon(
                    lesson.category
                );


            let thumbnailHTML =
                "";


            if (thumbnail) {

                thumbnailHTML =

                    `
                    <img
                        src="${escapeHTML(thumbnail)}"
                        alt="${title}"
                        loading="lazy">
                    `;

            }

            else {

                thumbnailHTML =

                    `
                    <div class="thumbnail-placeholder">

                        <i
                            class="fa-solid ${icon}">
                        </i>

                    </div>
                    `;

            }


            card.innerHTML = `

                <div class="thumbnail">

                    ${thumbnailHTML}

                    <span class="level">

                        ${level}

                    </span>

                </div>


                <div class="lesson-content">

                    <div class="category">

                        ${category}

                    </div>


                    <h2>

                        ${title}

                    </h2>


                    <p class="description">

                        ${description}

                    </p>


                    <div class="lesson-meta">

                        <span>

                            <i
                                class="fa-regular fa-clock">
                            </i>

                            ${
                                duration > 0
                                ? duration + " min"
                                : "Duração livre"
                            }

                        </span>


                        <span>

                            <i
                                class="fa-solid fa-signal">
                            </i>

                            ${level}

                        </span>

                    </div>


                    ${
                        video
                        ?

                        `
                        <button
                            class="watch-btn">

                            <i
                                class="fa-solid fa-play">
                            </i>

                            Assistir aula

                        </button>
                        `

                        :

                        `
                        <button
                            class="watch-btn disabled"
                            title="Esta aula ainda não possui vídeo cadastrado">

                            <i
                                class="fa-solid fa-clock">
                            </i>

                            Vídeo em breve

                        </button>
                        `

                    }

                </div>

            `;


            const button =
                card.querySelector(
                    ".watch-btn"
                );


            if (
                video &&
                button
            ) {

                button.addEventListener(
                    "click",
                    function () {

                        openLesson(
                            lesson
                        );

                    }
                );

            }


            return card;

        }


        /* =================================================
           ABRIR AULA
        ================================================= */

        function openLesson(
            lesson
        ) {

            modalTitle.textContent =
                lesson.title ||
                "Aula";


            modalDescription.textContent =
                lesson.description ||
                "";


            videoContainer.innerHTML =
                "";


            if (
                lesson.video_url
            ) {

                const url =
                    lesson.video_url;


                if (
                    isYouTube(url)
                ) {

                    const videoId =
                        getYouTubeId(
                            url
                        );


                    if (videoId) {

                        videoContainer.innerHTML = `

                            <iframe

                                src="https://www.youtube.com/embed/${videoId}"

                                title="${escapeHTML(lesson.title)}"

                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

                                allowfullscreen>

                            </iframe>

                        `;

                    }

                }

                else {

                    videoContainer.innerHTML = `

                        <video

                            src="${escapeHTML(url)}"

                            controls

                            style="
                                width:100%;
                                height:100%;
                            ">

                        </video>

                    `;

                }

            }


            if (
                videoContainer.innerHTML === ""
            ) {

                videoContainer.innerHTML = `

                    <div class="video-placeholder">

                        <i
                            class="fa-solid fa-video-slash">
                        </i>

                        <p>
                            Não foi possível carregar
                            o vídeo desta aula.
                        </p>

                    </div>

                `;

            }


            modal.classList.add(
                "show"
            );


            document.body.style.overflow =
                "hidden";

        }


        /* =================================================
           YOUTUBE
        ================================================= */

        function isYouTube(
            url
        ) {

            return (
                url.includes(
                    "youtube.com"
                )
                ||
                url.includes(
                    "youtu.be"
                )
            );

        }


        function getYouTubeId(
            url
        ) {

            try {

                const parsed =
                    new URL(
                        url
                    );


                if (
                    parsed.hostname.includes(
                        "youtu.be"
                    )
                ) {

                    return parsed.pathname
                        .replace(
                            "/",
                            ""
                        );

                }


                if (
                    parsed.searchParams.get(
                        "v"
                    )
                ) {

                    return parsed.searchParams.get(
                        "v"
                    );

                }


                const parts =
                    parsed.pathname.split(
                        "/"
                    );


                const embedIndex =
                    parts.indexOf(
                        "embed"
                    );


                if (
                    embedIndex !== -1
                    &&
                    parts[embedIndex + 1]
                ) {

                    return parts[
                        embedIndex + 1
                    ];

                }


            }

            catch (error) {

                console.error(
                    error
                );

            }


            return null;

        }


        /* =================================================
           FECHAR MODAL
        ================================================= */

        function closeLesson() {

            modal.classList.remove(
                "show"
            );


            videoContainer.innerHTML =
                "";


            document.body.style.overflow =
                "";

        }


        closeModal.addEventListener(
            "click",
            closeLesson
        );


        modal.addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    modal
                ) {

                    closeLesson();

                }

            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeLesson();

                }

            }
        );


        /* =================================================
           FILTROS
        ================================================= */

        filters.forEach(
            function (filter) {

                filter.addEventListener(
                    "click",
                    function () {


                        filters.forEach(
                            function (item) {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        this.classList.add(
                            "active"
                        );


                        currentCategory =
                            this.dataset.category;


                        renderLessons();

                    }
                );

            }
        );


        /* =================================================
           PESQUISA
        ================================================= */

        searchInput.addEventListener(
            "input",
            function () {

                renderLessons();

            }
        );


        /* =================================================
           INICIAR
        ================================================= */

        await loadLessons();

    }

);

</script>
