<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Aulas e conteúdos para melhorar sua corrida no Projeto Corre.">

    <meta
        name="theme-color"
        content="#A3FF12">

    <title>Projeto Corre | Aulas</title>


    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --green: #A3FF12;
            --green-dark: #78c400;

            --black: #080808;
            --dark: #101010;
            --dark-2: #151515;
            --dark-3: #1d1d1d;

            --white: #ffffff;

            --gray: #777;
            --gray-light: #aaa;

            --border: #292929;

        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at 80% 10%,
                    rgba(163,255,18,.08),
                    transparent 30%
                ),

                #080808;

            color: white;

            font-family: "Poppins", sans-serif;

            overflow-x: hidden;

        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            height: 75px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid rgba(255,255,255,.06);

            background: rgba(8,8,8,.92);

            backdrop-filter: blur(15px);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 19px;

            font-weight: 800;

        }


        .logo i {

            color: var(--green);

            font-size: 23px;

        }


        .logo span {
            color: var(--green);
        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 22px;

        }


        .back {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #777;

            font-size: 12px;

            transition: .2s;

        }


        .back:hover {
            color: var(--green);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            width: min(1100px, 92%);

            margin: auto;

            padding: 48px 0 70px;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            margin-bottom: 35px;

        }


        .hero-label {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 7px 11px;

            border: 1px solid rgba(163,255,18,.18);

            background: rgba(163,255,18,.06);

            border-radius: 999px;

            color: var(--green);

            font-size: 10px;

            font-weight: 700;

            margin-bottom: 15px;

        }


        .hero h1 {

            font-size: 36px;

            line-height: 1.15;

            letter-spacing: -1.2px;

            margin-bottom: 9px;

        }


        .hero h1 span {
            color: var(--green);
        }


        .hero p {

            max-width: 620px;

            color: #666;

            font-size: 13px;

            line-height: 1.7;

        }


        /* =====================================================
           CONTROLES
        ===================================================== */

        .controls {

            display: flex;

            gap: 12px;

            margin-bottom: 28px;

        }


        .search {

            position: relative;

            flex: 1;

        }


        .search i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #555;

            font-size: 13px;

            pointer-events: none;

        }


        .search input {

            width: 100%;

            height: 46px;

            padding: 0 15px 0 42px;

            border: 1px solid var(--border);

            border-radius: 11px;

            outline: none;

            background: #101010;

            color: white;

            font-size: 12px;

        }


        .search input::placeholder {
            color: #555;
        }


        .search input:focus {
            border-color: var(--green);
        }


        .filter {

            width: 180px;

            height: 46px;

            padding: 0 12px;

            border: 1px solid var(--border);

            border-radius: 11px;

            outline: none;

            background: #101010;

            color: #aaa;

            font-size: 12px;

            cursor: pointer;

        }


        .filter:focus {
            border-color: var(--green);
        }


        /* =====================================================
           CONTADOR
        ===================================================== */

        .results-info {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 16px;

        }


        .results-info span {

            color: #555;

            font-size: 11px;

        }


        .results-info strong {
            color: #aaa;
        }


        /* =====================================================
           GRID
        ===================================================== */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 17px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            position: relative;

            overflow: hidden;

            padding: 24px;

            background:

                linear-gradient(
                    145deg,
                    rgba(22,22,22,.98),
                    rgba(13,13,13,.98)
                );

            border: 1px solid var(--border);

            border-radius: 18px;

            transition:
                transform .25s,
                border-color .25s,
                box-shadow .25s;

        }


        .card:hover {

            transform: translateY(-4px);

            border-color:
                rgba(163,255,18,.30);

            box-shadow:
                0 18px 40px rgba(0,0,0,.30);

        }


        .card-top {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;

        }


        .card-icon {

            width: 49px;

            height: 49px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            border-radius: 14px;

            background: rgba(163,255,18,.08);

            border: 1px solid rgba(163,255,18,.14);

            color: var(--green);

            font-size: 19px;

        }


        .level {

            padding: 5px 9px;

            border-radius: 999px;

            background: rgba(255,255,255,.04);

            border: 1px solid #292929;

            color: #777;

            font-size: 9px;

            white-space: nowrap;

        }


        .card h2 {

            font-size: 16px;

            line-height: 1.4;

            margin-bottom: 8px;

        }


        .card p {

            color: #666;

            font-size: 11px;

            line-height: 1.7;

            min-height: 57px;

        }


        /* =====================================================
           META
        ===================================================== */

        .meta {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-top: 18px;

            padding-top: 15px;

            border-top: 1px solid #202020;

        }


        .meta span {

            display: flex;

            align-items: center;

            gap: 6px;

            color: #666;

            font-size: 10px;

        }


        .meta i {

            color: var(--green);

            font-size: 10px;

        }


        /* =====================================================
           BOTÃO
        ===================================================== */

        .btn {

            width: 100%;

            height: 43px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            margin-top: 17px;

            border-radius: 10px;

            background: var(--green);

            color: #080808;

            font-size: 11px;

            font-weight: 800;

            transition: .2s;

        }


        .btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(163,255,18,.12);

        }


        .btn.disabled {

            background: #202020;

            color: #555;

            cursor: not-allowed;

            box-shadow: none;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            grid-column: 1 / -1;

            min-height: 260px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            color: #555;

        }


        .loading i {

            color: var(--green);

            font-size: 25px;

            margin-bottom: 12px;

        }


        .loading span {
            font-size: 11px;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            grid-column: 1 / -1;

            padding: 70px 20px;

            text-align: center;

            border: 1px solid #202020;

            border-radius: 18px;

            background: #101010;

        }


        .empty i {

            color: #444;

            font-size: 35px;

            margin-bottom: 15px;

        }


        .empty h3 {

            font-size: 15px;

            margin-bottom: 6px;

        }


        .empty p {

            color: #555;

            font-size: 11px;

        }


        /* =====================================================
           ERRO
        ===================================================== */

        .error-box {

            grid-column: 1 / -1;

            padding: 22px;

            border: 1px solid rgba(255,70,70,.20);

            background: rgba(255,50,50,.06);

            border-radius: 15px;

            color: #ff7777;

            font-size: 11px;

            line-height: 1.7;

        }


        .error-box strong {

            display: block;

            margin-bottom: 5px;

            font-size: 13px;

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media(max-width: 700px) {

            header {
                padding: 0 5%;
            }


            .header-right {
                gap: 10px;
            }


            main {
                width: 92%;
                padding-top: 35px;
            }


            .hero h1 {
                font-size: 30px;
            }


            .controls {
                flex-direction: column;
            }


            .filter {
                width: 100%;
            }


            .grid {
                grid-template-columns: 1fr;
            }

        }


        @media(max-width: 450px) {

            .back span {
                display: none;
            }


            .hero h1 {
                font-size: 27px;
            }


            .card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <a
        href="painel.html"
        class="logo">

        <i class="fa-solid fa-person-running"></i>

        Projeto <span>Corre</span>

    </a>


    <div class="header-right">

        <a
            href="painel.html"
            class="back">

            <i class="fa-solid fa-arrow-left"></i>

            <span>Voltar para o painel</span>

        </a>

    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main>


    <!-- HERO -->

    <section class="hero">

        <div class="hero-label">

            <i class="fa-solid fa-graduation-cap"></i>

            ÁREA DE APRENDIZADO

        </div>


        <h1>

            Aprenda a

            <span>correr melhor.</span>

        </h1>


        <p>

            Conteúdos preparados para ajudar você a
            melhorar sua técnica, controlar seu ritmo,
            fortalecer o corpo e evoluir nos seus treinos.

        </p>

    </section>


    <!-- CONTROLES -->

    <section class="controls">


        <div class="search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="search"
                id="searchInput"
                placeholder="Pesquisar aula...">

        </div>


        <select
            class="filter"
            id="categoryFilter">

            <option value="all">
                Todas as categorias
            </option>

            <option value="tecnica">
                Técnica de corrida
            </option>

            <option value="respiracao">
                Respiração
            </option>

            <option value="forca">
                Fortalecimento
            </option>

            <option value="ritmo">
                Ritmo e pace
            </option>

        </select>


        <select
            class="filter"
            id="levelFilter">

            <option value="all">
                Todos os níveis
            </option>

            <option value="Iniciante">
                Iniciante
            </option>

            <option value="Intermediário">
                Intermediário
            </option>

            <option value="Avançado">
                Avançado
            </option>

        </select>

    </section>


    <!-- INFORMAÇÕES -->

    <div class="results-info">

        <span id="resultsText">
            Carregando aulas...
        </span>

    </div>


    <!-- AULAS -->

    <section
        class="grid"
        id="lessonsGrid">

        <div class="loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <span>
                Carregando aulas...
            </span>

        </div>

    </section>


</main>


<script src="script.js"></script>


<script>

document.addEventListener("DOMContentLoaded", async function () {

    /* =====================================================
       CONFIGURAÇÃO SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        "https://mubzyyppizxuofitnysp.supabase.co";

    /*
       IMPORTANTE:

       Esta é a chave pública do projeto.
       Ela pode ficar no JavaScript do site.

       NUNCA coloque aqui uma service_role key.
    */

    const SUPABASE_KEY =
        "sb_publishable_7TMsNk3z-oks9HQjTfi6ug_dy0Rvaw0";


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const grid =
        document.getElementById("lessonsGrid");

    const searchInput =
        document.getElementById("searchInput");

    const categoryFilter =
        document.getElementById("categoryFilter");

    const levelFilter =
        document.getElementById("levelFilter");

    const resultsText =
        document.getElementById("resultsText");


    let lessons = [];


    /* =====================================================
       ÍCONES
    ===================================================== */

    function getIcon(category) {

        switch (category) {

            case "tecnica":
                return "fa-shoe-prints";

            case "respiracao":
                return "fa-heart-pulse";

            case "forca":
                return "fa-dumbbell";

            case "ritmo":
                return "fa-stopwatch";

            default:
                return "fa-person-running";

        }

    }


    /* =====================================================
       NOME DA CATEGORIA
    ===================================================== */

    function getCategoryName(category) {

        switch (category) {

            case "tecnica":
                return "Técnica";

            case "respiracao":
                return "Respiração";

            case "forca":
                return "Fortalecimento";

            case "ritmo":
                return "Ritmo";

            default:
                return "Corrida";

        }

    }


    /* =====================================================
       ESCAPAR HTML
       Proteção contra conteúdo HTML indevido
    ===================================================== */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =====================================================
       FORMATAR DURAÇÃO
    ===================================================== */

    function formatDuration(minutes) {

        const value =
            Number(minutes) || 0;

        if (value <= 0) {
            return "Duração não informada";
        }

        return `${value} min`;

    }


    /* =====================================================
       BUSCAR AULAS
    ===================================================== */

    async function loadLessons() {

        try {

            const response =
                await fetch(
                    `${SUPABASE_URL}/rest/v1/lessons?select=*&is_published=eq.true&order=sort_order.asc`,
                    {
                        method: "GET",

                        headers: {

                            "apikey": SUPABASE_KEY,

                            "Authorization":
                                `Bearer ${SUPABASE_KEY}`,

                            "Content-Type":
                                "application/json"

                        }
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "Erro Supabase:",
                    errorText
                );

                throw new Error(
                    `Erro ${response.status} ao carregar as aulas.`
                );

            }


            lessons =
                await response.json();


            renderLessons();

        } catch (error) {

            console.error(error);


            grid.innerHTML = `

                <div class="error-box">

                    <strong>
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        Não foi possível carregar as aulas.
                    </strong>

                    Verifique sua conexão e tente novamente.

                </div>

            `;


            resultsText.textContent =
                "Erro ao carregar aulas.";

        }

    }


    /* =====================================================
       RENDERIZAR AULAS
    ===================================================== */

    function renderLessons() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const category =
            categoryFilter.value;


        const level =
            levelFilter.value;


        const filtered =
            lessons.filter(function (lesson) {

                const title =
                    String(
                        lesson.title || ""
                    ).toLowerCase();


                const description =
                    String(
                        lesson.description || ""
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    title.includes(search) ||
                    description.includes(search);


                const matchesCategory =
                    category === "all" ||
                    lesson.category === category;


                const matchesLevel =
                    level === "all" ||
                    lesson.level === level;


                return (
                    matchesSearch &&
                    matchesCategory &&
                    matchesLevel
                );

            });


        resultsText.innerHTML =
            `<strong>${filtered.length}</strong> aula(s) encontrada(s)`;


        if (filtered.length === 0) {

            grid.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <h3>
                        Nenhuma aula encontrada
                    </h3>

                    <p>
                        Tente mudar os filtros ou pesquisar outro termo.
                    </p>

                </div>

            `;

            return;

        }


        grid.innerHTML =
            filtered.map(createLessonCard).join("");

    }


    /* =====================================================
       CRIAR CARD
    ===================================================== */

    function createLessonCard(lesson) {

        const id =
            encodeURIComponent(
                lesson.id
            );


        const title =
            escapeHTML(
                lesson.title
            );


        const description =
            escapeHTML(
                lesson.description ||
                "Conteúdo exclusivo do Projeto Corre."
            );


        const category =
            escapeHTML(
                getCategoryName(
                    lesson.category
                )
            );


        const level =
            escapeHTML(
                lesson.level ||
                "Iniciante"
            );


        const duration =
            escapeHTML(
                formatDuration(
                    lesson.duration
                )
            );


        const icon =
            getIcon(
                lesson.category
            );


        let button;


        if (lesson.video_url) {

            button = `

                <a
                    href="aula.html?id=${id}"
                    class="btn">

                    <i class="fa-solid fa-play"></i>

                    Assistir aula

                </a>

            `;

        } else {

            button = `

                <a
                    href="aula.html?id=${id}"
                    class="btn">

                    <i class="fa-solid fa-arrow-right"></i>

                    Ver aula

                </a>

            `;

        }


        return `

            <article class="card">


                <div class="card-top">


                    <div class="card-icon">

                        <i class="fa-solid ${icon}"></i>

                    </div>


                    <span class="level">

                        ${level}

                    </span>


                </div>


                <h2>

                    ${title}

                </h2>


                <p>

                    ${description}

                </p>


                <div class="meta">


                    <span>

                        <i class="fa-solid fa-layer-group"></i>

                        ${category}

                    </span>


                    <span>

                        <i class="fa-regular fa-clock"></i>

                        ${duration}

                    </span>


                </div>


                ${button}


            </article>

        `;

    }


    /* =====================================================
       FILTROS
    ===================================================== */

    searchInput.addEventListener(
        "input",
        renderLessons
    );


    categoryFilter.addEventListener(
        "change",
        renderLessons
    );


    levelFilter.addEventListener(
        "change",
        renderLessons
    );


    /* =====================================================
       INICIAR
    ===================================================== */

    loadLessons();

});

</script>


</body>

</html>
