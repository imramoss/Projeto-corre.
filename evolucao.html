<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projeto Corre | Evolução</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#080808;
color:white;
font-family:Poppins,sans-serif;
}

header{
height:75px;
border-bottom:1px solid #292929;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 7%;
}

a{
color:inherit;
text-decoration:none;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo i,
.logo span{
color:#A3FF12;
}

.back{
font-size:12px;
color:#777;
}

main{
max-width:1000px;
margin:auto;
padding:45px 20px;
}

h1{
font-size:30px;
}

.subtitle{
color:#666;
font-size:12px;
margin:8px 0 30px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
}

.stat{
background:#111;
border:1px solid #292929;
border-radius:18px;
padding:25px;
}

.stat i{
color:#A3FF12;
font-size:22px;
margin-bottom:15px;
}

.stat strong{
font-size:25px;
display:block;
}

.stat span{
font-size:10px;
color:#666;
}

.chart{
margin-top:20px;
padding:30px;
background:#111;
border:1px solid #292929;
border-radius:18px;
}

.chart h2{
font-size:15px;
margin-bottom:25px;
}

.bar{
height:35px;
background:#1c1c1c;
border-radius:8px;
overflow:hidden;
margin-bottom:12px;
}

.bar div{
height:100%;
background:#A3FF12;
width:0;
transition:1s;
}

@media(max-width:650px){

.stats{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>

<a href="painel.html" class="logo">

<i class="fa-solid fa-person-running"></i>

Projeto <span>Corre</span>

</a>

<a href="painel.html" class="back">

<i class="fa-solid fa-arrow-left"></i>
Voltar

</a>

</header>

<main>

<h1>
Minha <span style="color:#A3FF12">evolução</span>
</h1>

<p class="subtitle">
Acompanhe sua caminhada.
</p>

<div class="stats">

<div class="stat">

<i class="fa-solid fa-road"></i>

<strong>0 km</strong>

<span>Distância total</span>

</div>

<div class="stat">

<i class="fa-solid fa-person-running"></i>

<strong>0</strong>

<span>Treinos realizados</span>

</div>

<div class="stat">

<i class="fa-solid fa-trophy"></i>

<strong>0</strong>

<span>Conquistas</span>

</div>

</div>

<div class="chart">

<h2>
Meta semanal
</h2>

<p style="color:#666;font-size:11px;margin-bottom:10px;">
0 km de 5 km
</p>

<div class="bar">

<div style="width:0%"></div>

</div>

</div>

</main>

<script src="script.js"></script>

</body>

</html>
