<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projeto Corre | Perfil</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#080808;
color:white;
font-family:Poppins,sans-serif;
}

header{
height:75px;
border-bottom:1px solid #292929;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 7%;
}

a{
color:inherit;
text-decoration:none;
}

.logo{
font-size:20px;
font-weight:800;
}

.logo i,
.logo span{
color:#A3FF12;
}

.back{
color:#777;
font-size:12px;
}

main{
max-width:700px;
margin:auto;
padding:45px 20px;
}

h1{
font-size:30px;
margin-bottom:30px;
}

.profile-card{
background:#111;
border:1px solid #292929;
border-radius:22px;
padding:35px;
text-align:center;
}

.profile-card img{
width:90px;
height:90px;
border-radius:50%;
border:3px solid #A3FF12;
margin-bottom:18px;
}

.profile-card h2{
font-size:20px;
}

.email{
color:#666;
font-size:12px;
margin-top:5px;
}

.info{
margin-top:30px;
display:grid;
gap:12px;
text-align:left;
}

.info div{
background:#171717;
padding:15px;
border-radius:10px;
}

.info small{
display:block;
color:#666;
font-size:9px;
margin-bottom:4px;
}

.info strong{
font-size:12px;
}

.logout{
margin-top:25px;
width:100%;
height:48px;
border:1px solid #522020;
background:rgba(255,50,50,.05);
color:#ff7777;
border-radius:10px;
cursor:pointer;
font-family:inherit;
}

.logout:hover{
background:rgba(255,50,50,.12);
}

</style>

</head>

<body>

<header>

<a href="painel.html" class="logo">

<i class="fa-solid fa-person-running"></i>

Projeto <span>Corre</span>

</a>

<a href="painel.html" class="back">

<i class="fa-solid fa-arrow-left"></i>
Voltar

</a>

</header>

<main>

<h1>
Meu <span style="color:#A3FF12">perfil</span>
</h1>

<div class="profile-card">

<img
data-user-avatar
alt="Avatar">

<h2 data-user-name></h2>

<p
class="email"
data-user-email>
</p>

<div class="info">

<div>

<small>
NOME
</small>

<strong data-user-name></strong>

</div>

<div>

<small>
E-MAIL
</small>

<strong data-user-email></strong>

</div>

<div>

<small>
PLANO
</small>

<strong>
Gratuito
</strong>

</div>

</div>

<button
class="logout"
data-logout>

<i class="fa-solid fa-right-from-bracket"></i>

 Sair da conta

</button>

</div>

</main>

<script src="script.js"></script>

</body>

</html>
