<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minha evolução | Projeto Corre</title>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
background:#080808;
color:white;
font-family:Poppins,Arial,sans-serif;
}

header {
padding:20px 5%;
border-bottom:1px solid #292929;
}

header a {
color:#A3FF12;
text-decoration:none;
}

main {
width:min(1100px,92%);
margin:auto;
padding:50px 0;
}

.cards {
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px;
}

.card {
background:#151515;
border:1px solid #292929;
border-radius:20px;
padding:25px;
}

.card strong {
font-size:30px;
color:#A3FF12;
}

.card p {
color:#777;
font-size:13px;
}

.progress {
margin-top:30px;
background:#151515;
padding:30px;
border-radius:20px;
}

.bar {
height:12px;
background:#292929;
border-radius:20px;
margin-top:20px;
overflow:hidden;
}

.bar div {
height:100%;
width:15%;
background:#A3FF12;
}

@media(max-width:700px) {
.cards {
grid-template-columns:1fr;
}
}

</style>

</head>

<body>

<header>

<a href="dashboard.html">
← Voltar para o painel
</a>

</header>

<main>

<h1>
Minha evolução
</h1>

<p style="color:#777">
Acompanhe cada passo da sua jornada.
</p>

<div class="cards">

<div class="card">

<strong>0 km</strong>

<p>
Distância total
</p>

</div>

<div class="card">

<strong>0</strong>

<p>
Treinos concluídos
</p>

</div>

<div class="card">

<strong>1</strong>

<p>
Dia de jornada
</p>

</div>

</div>

<div class="progress">

<h2>
Jornada do iniciante
</h2>

<p style="color:#777">
Você está apenas começando. Continue!
</p>

<div class="bar">
<div></div>
</div>

</div>

</main>

</body>

</html>
