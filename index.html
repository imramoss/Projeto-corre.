<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projeto Corre</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0d0d0d;color:#fff}
header{display:flex;justify-content:space-between;padding:20px 8%;background:#111}
nav a{color:#fff;text-decoration:none;margin-left:20px}
.hero{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.btn{background:#9cff00;color:#000;padding:15px 30px;border-radius:30px;text-decoration:none;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:40px 8%}
.card{background:#1b1b1b;padding:20px;border-radius:12px}
footer{text-align:center;padding:30px;background:#111}
</style>
</head>
<body>
<header><h2>Projeto Corre</h2><nav><a href="#">Início</a><a href="#">Cursos</a><a href="#">Premium</a></nav></header>
<section class="hero">
<h1>Seu próximo passo começa aqui.</h1>
<p>Aprenda a correr do zero e evolua no seu ritmo.</p>
<a class="btn" href="#">Começar Agora</a>
</section>
<section class="cards">
<div class="card"><h3>Comece do Zero</h3><p>Treinos para iniciantes.</p></div>
<div class="card"><h3>Vídeos</h3><p>Aulas sobre corrida.</p></div>
<div class="card"><h3>Evolução</h3><p>Acompanhe seu progresso.</p></div>
</section>
<footer>© Projeto Corre 2026</footer>
<script src="js/script.js"></script>
</body>
</html>
